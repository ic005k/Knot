name: Manual Release (Draft)

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: '版本号递增类型'
        required: true
        default: 'patch'
        type: choice
        options: [patch, minor, major]

jobs:
  draft-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # ✅ 改动1: 显式指定 ref 为主分支，避免手动触发时 HEAD 指向旧 commit
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Calculate next version
        id: version
        shell: bash
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "2.2.14")

          IFS='.' read -r MAJOR MINOR PATCH <<< "$LATEST_TAG"
          MAJOR=$((10#$MAJOR)); MINOR=$((10#$MINOR)); PATCH=$((10#$PATCH))

          case "${{ github.event.inputs.bump_type }}" in
            major) MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR+1)); PATCH=0
                   [ "$MINOR" -gt 9 ] && { MINOR=0; MAJOR=$((MAJOR+1)); } ;;
            *)     PATCH=$((PATCH+1))
                   [ "$PATCH" -gt 99 ] && { PATCH=0; MINOR=$((MINOR+1));
                     [ "$MINOR" -gt 9 ] && { MINOR=0; MAJOR=$((MAJOR+1)); }; } ;;
          esac

          NEXT=$(printf "%d.%d.%02d" "$MAJOR" "$MINOR" "$PATCH")
          echo "next_tag=${NEXT}" >> "$GITHUB_OUTPUT"
          echo "prev_tag=${LATEST_TAG}" >> "$GITHUB_OUTPUT"
          echo "✅ Next version: ${NEXT} (based on ${LATEST_TAG})"

      # ✅ 改动2: Changelog 写入临时文件，不再使用 GITHUB_OUTPUT 传递多行文本
      - name: Generate Changelog via git log
        shell: bash
        run: |
          PREV_TAG="${{ steps.version.outputs.prev_tag }}"
          LOG=$(git log "${PREV_TAG}..HEAD" --pretty=format:"- %s" --no-merges)

          if [ -z "$LOG" ]; then
            LOG="- No changes recorded."
            echo "⚠️  No new commits since ${PREV_TAG}"
          else
            COUNT=$(echo "$LOG" | wc -l)
            echo "📝 Generated ${COUNT} changelog entries"
          fi

          echo "$LOG" > /tmp/changelog.md
          echo "$LOG" | head -20

      # ❌ 已删除: Create or reuse tag (idempotent) 步骤
      # Tag 不再预先创建，删除草稿时不会留下废弃 Tag

      # ✅ 改动3: 使用 body_path 读取文件，draft 模式下 softprops 不会预建 Tag
      - name: Create Draft Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.next_tag }}
          name: Release ${{ steps.version.outputs.next_tag }}
          body_path: /tmp/changelog.md
          draft: true
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}