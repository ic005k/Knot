name: Android CI (CMake)

on:
  push:
    branches: [ main ]
    paths:
      - '**'
      - '!stats.txt'
      - '!README.md'
  pull_request:
    paths:
      - '**'
  release:
    types: [ published ]

env:
  QT_VERSION: "6.10.3"
  QT_ARCH_ANDROID: "android_arm64_v8a"
  QT_ARCH_DESKTOP: "win64_mingw"
  NDK_VERSION: "26.1.10909125"  # 直接使用 r26b，避免 r27 兼容性问题
  ANDROID_API_LEVEL: "34"
  JAVA_VERSION: "17"
  CMAKE_VERSION: "3.30.5"
  NINJA_VERSION: "1.12.1"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          path: 'src'

      # 1. 安装 JDK
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}

      # 2. 安装 CMake 和 Ninja
      - name: Install CMake & Ninja
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: ${{ env.CMAKE_VERSION }}
          ninjaVersion: ${{ env.NINJA_VERSION }}

      # 3. 安装 NDK (直接使用官方 r26b)
      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b
          add-to-path: false

      # 4. 安装桌面版 Qt (提供宿主工具)
      - name: Install Desktop Qt
        run: |
          python -m pip install --upgrade aqtinstall
          aqt install-qt windows desktop ${{ env.QT_VERSION }} ${{ env.QT_ARCH_DESKTOP }} `
            -m qtcharts qtsensors qtwebview qtlocation qtwebchannel qt5compat qtpositioning qtmultimedia `
            --outputdir "${{ github.workspace }}/Qt"

      # 5. 安装 Android 版 Qt
      - name: Install Android Qt
        run: |
          aqt install-qt windows android ${{ env.QT_VERSION }} ${{ env.QT_ARCH_ANDROID }} `
            -m qtcharts qtsensors qtwebview qtlocation qtwebchannel qt5compat qtpositioning qtmultimedia `
            --outputdir "${{ github.workspace }}/Qt"

      # 6. CMake 配置与构建
      - name: Configure and Build
        shell: pwsh
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          $qtRoot = "${{ github.workspace }}/Qt/${{ env.QT_VERSION }}/${{ env.QT_ARCH_ANDROID }}"
          $desktopQtRoot = "${{ github.workspace }}/Qt/${{ env.QT_VERSION }}/${{ env.QT_ARCH_DESKTOP }}"

          # 确保 CMake 能找到 Qt 工具和 NDK
          $env:PATH = "$qtRoot/bin;$desktopQtRoot/bin;$env:ANDROID_NDK_HOME/toolchains/llvm/prebuilt/windows-x86_64/bin;$env:PATH"

          cd src

          cmake -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$qtRoot" `
            -DQT_HOST_PATH="$desktopQtRoot" `
            -DCMAKE_TOOLCHAIN_FILE="$qtRoot/lib/cmake/Qt6/qt.toolchain.cmake" `
            -DANDROID_ABI=arm64-v8a `
            -DANDROID_NATIVE_API_LEVEL=${{ env.ANDROID_API_LEVEL }} `
            -DANDROID_NDK_HOME="$env:ANDROID_NDK_HOME" `
            -DQT_ANDROID_BUILD_ALL_ABIS=OFF

          cmake --build build --config Release -j8

      # 7. 生成并签名 APK (CMake 自动处理)
      - name: Generate and Sign APK
        shell: pwsh
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd src/build

          # 解码 Keystore
          $keystorePath = "${{ github.workspace }}/signing/release.keystore"
          New-Item -ItemType Directory -Force -Path "${{ github.workspace }}/signing" | Out-Null
          [System.Convert]::FromBase64String($env:KEYSTORE_BASE64) | Set-Content -Path $keystorePath -Encoding Byte

          if (-not (Test-Path $keystorePath)) { throw "Keystore 解码失败" }

          # 使用 CMake 内置的 androiddeployqt 目标进行打包和签名
          # 注意：CMake 项目中通常需要定义 qt_add_executable 或 qt_android_generate_deployment_settings
          cmake --build . --target apk --config Release -- `
            -DQT_ANDROID_KEYSTORE_PATH="$keystorePath" `
            -DQT_ANDROID_KEYSTORE_ALIAS="$env:KEY_ALIAS" `
            -DQT_ANDROID_KEYSTORE_STORE_PASS="$env:KEYSTORE_PASSWORD" `
            -DQT_ANDROID_KEYSTORE_KEY_PASS="$env:KEY_PASSWORD" `
            -DQT_ANDROID_SIGN=ON

      # 8. 上传 Artifact
      - name: Upload signed APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Knot-APK-signed
          path: src/build/android-build/build/outputs/apk/release/*.apk

      # 9. 发布到 GitHub Release
      - name: Upload to GitHub Release
        if: github.event_name == 'release'
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: src/build/android-build/build/outputs/apk/release/*.apk
          asset_name: android-build-release-signed.apk
          tag: ${{ github.ref_name }}
          overwrite: true