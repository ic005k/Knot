name: Android Build Test (Minimal)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  test-configure:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install Qt 6.10.3 (Android)
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.10.3'
        host: 'windows'
        target: 'android'
        arch: 'android_arm64_v8a'
        modules: 'qtwebsockets qtwebchannel' # 根据你项目实际需要的模块调整
        cache: true

    - name: Install NDK r27
      uses: nttld/setup-ndk@v1
      id: setup-ndk
      with:
        ndk-version: r27c
        add-to-path: false

    - name: Set Environment Variables
      shell: pwsh
      run: |
        echo "ANDROID_NDK_ROOT=${{ steps.setup-ndk.outputs.ndk-path }}" >> $env:GITHUB_ENV
        echo "QT_ROOT_DIR=${{ env.QT_ROOT_DIR }}" >> $env:GITHUB_ENV
        # Qt 6.8+ 需要指定 HOST_PATH，通常 jurplel 插件会自动设置，这里保险起见手动确认一下
        if (-not $env:QT_HOST_PATH) {
           # 如果 jurplel 没设置，这里可能需要手动指向 host 版 Qt，但通常 android target 安装包内自带或依赖 host 版
           # 这里先假设 jurplel 已经处理好了 QT_ROOT_DIR 指向 android 版
        }

    - name: 🔍 Dynamic CRT Path Discovery
      shell: pwsh
      run: |
        $ndkRoot = $env:ANDROID_NDK_ROOT
        Write-Host "Searching for CRT files in NDK: $ndkRoot"

        # 递归搜索 crtbegin_dynamic.o
        $crtFile = Get-ChildItem -Path $ndkRoot -Recurse -Filter "crtbegin_dynamic.o" -ErrorAction SilentlyContinue |
                   Where-Object { $_.FullName -match "aarch64" } |
                   Select-Object -First 1

        if ($crtFile) {
            $crtDir = $crtFile.DirectoryName -replace '\\', '/'
            Write-Host "✅ SUCCESS: Found CRT directory."
            Write-Host "   Path: $crtDir"

            # 将路径存入环境变量，供下一步 CMake 使用
            echo "ANDROID_CRT_DIR=$crtDir" >> $env:GITHUB_ENV

            # 验证文件是否存在
            if (Test-Path "$crtDir/crtbegin_dynamic.o") {
                Write-Host "   ✅ crtbegin_dynamic.o confirmed."
            }
            if (Test-Path "$crtDir/crtend_android.o") {
                Write-Host "   ✅ crtend_android.o confirmed."
            }
        } else {
            Write-Error "::error::Failed to find crtbegin_dynamic.o in NDK root: $ndkRoot"
            exit 1
        }

    - name: 🛠️ CMake Configure (Test)
      shell: pwsh
      run: |
        # 确保使用 qt-cmake
        $qtCmake = Join-Path $env:QT_ROOT_DIR "bin\qt-cmake.bat"
        if (-not (Test-Path $qtCmake)) {
            # 有些 jurplel 版本可能直接叫 cmake，或者在 bin 目录下
            $qtCmake = Join-Path $env:QT_ROOT_DIR "bin\cmake.exe"
        }

        Write-Host "Using Qt CMake: $qtCmake"
        Write-Host "Injecting CRT Linker Flag: -L$env:ANDROID_CRT_DIR"

        # 构建 CMake 参数
        $cmakeArgs = @(
            "-B", "build-android-test",
            "-G", "Ninja",
            "-DCMAKE_BUILD_TYPE=Release",
            "-DANDROID_ABI=arm64-v8a",
            "-DANDROID_PLATFORM=android-34",
            "-DANDROID_NDK_ROOT=$env:ANDROID_NDK_ROOT",
            # 关键：注入 CRT 路径到链接器标志
            "-DCMAKE_EXE_LINKER_FLAGS=-L$env:ANDROID_CRT_DIR",
            "-DCMAKE_SHARED_LINKER_FLAGS=-L$env:ANDROID_CRT_DIR",
            "-DCMAKE_MODULE_LINKER_FLAGS=-L$env:ANDROID_CRT_DIR"
        )

        # 执行 Configure
        & $qtCmake $cmakeArgs

        if ($LASTEXITCODE -ne 0) {
            Write-Error "::error::CMake Configure failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
        }

        Write-Host "🎉 SUCCESS: CMake Configure completed!"