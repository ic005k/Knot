name: Android CI (CMake)

on:
  push:
    branches: [ main ]
    paths-ignore: [ 'stats.txt', 'README.md' ]
  pull_request:
  release:
    types: [ published ]

env:
  QT_VERSION: "6.10.3"
  QT_ARCH: "android_arm64_v8a"
  HOST_ARCH: "win64_msvc2022_64"      # ✅ Qt 6.10 Windows 唯一 MSVC 宿主席位
  NDK_VERSION: "27.2.12479018"
  ANDROID_API_LEVEL: "34"
  JAVA_VERSION: "17"
  BUILD_TYPE: "Release"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
      with:
        path: src

    # 1️⃣ JDK
    - name: Setup JDK
      uses: actions/setup-java@v4
      with:
        distribution: zulu
        java-version: ${{ env.JAVA_VERSION }}

    # 2️⃣ NDK（r27c，Qt 6.10 官方搭配）
    - name: Install NDK
      shell: pwsh
      run: |
        $ndkUrl = "https://dl.google.com/android/repository/android-ndk-r27c-windows.zip"
        Invoke-WebRequest -Uri $ndkUrl -OutFile ndk.zip
        Expand-Archive ndk.zip -DestinationPath android-sdk\ndk
        Rename-Item android-sdk\ndk\android-ndk-r27c $env:NDK_VERSION
        echo "ANDROID_NDK_ROOT=$env:GITHUB_WORKSPACE\android-sdk\ndk\$env:NDK_VERSION" >> $env:GITHUB_ENV

    # 3️⃣ Host Qt（MSVC2022，只拿 qt-cmake / androiddeployqt）
    - name: Install Host Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ env.QT_VERSION }}
        host: windows
        target: desktop
        arch: ${{ env.HOST_ARCH }}
        modules: qtcharts qtsensors qtwebview qtlocation qtwebchannel qt5compat qtpositioning qtmultimedia
        cache: true
        setup-python: false

    # 4️⃣ Android Qt
    - name: Install Android Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ env.QT_VERSION }}
        host: windows
        target: android
        arch: ${{ env.QT_ARCH }}
        modules: qtcharts qtsensors qtwebview qtlocation qtwebchannel qt5compat qtpositioning qtmultimedia
        cache: true
        setup-python: false

    # 5️⃣ CMake Configure（qt-cmake 走 NDK toolchain，不碰 MSVC cl）
    - name: CMake Configure
      shell: pwsh
      run: |
        Set-Location "$env:GITHUB_WORKSPACE\src"
        qt-cmake -B build `
          -G Ninja `
          -DCMAKE_BUILD_TYPE=$env:BUILD_TYPE `
          -DANDROID_ABI=arm64-v8a `
          -DANDROID_PLATFORM=android-$env:ANDROID_API_LEVEL `
          -DANDROID_STL=c++_shared

    # 6️⃣ CMake Build
    - name: CMake Build
      shell: pwsh
      run: |
        Set-Location "$env:GITHUB_WORKSPACE\src"
        cmake --build build --config $env:BUILD_TYPE --parallel $env:NUMBER_OF_PROCESSORS

    # 7️⃣ APK 打包 & 签名
    - name: Package & Sign APK
      shell: cmd
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        cd "%GITHUB_WORKSPACE%\src"
        set "DEPLOY_QT=%QT_ROOT_DIR%\bin\androiddeployqt.exe"
        if not exist "%DEPLOY_QT%" ( echo ::error::androiddeployqt not found & exit 1 )
        set "JSON=build\android-Knot-deployment-settings.json"
        if not exist "%JSON%" ( echo ::error::deployment-settings.json not found & exit 1 )
        mkdir signing & cd signing
        PowerShell -Command "[IO.File]::WriteAllBytes('release.keystore', [Convert]::FromBase64String($env:KEYSTORE_BASE64))"
        cd ..
        "%DEPLOY_QT%" ^
          --input "%JSON%" ^
          --output build\android-build ^
          --android-platform android-%ANDROID_API_LEVEL% ^
          --jdk "%JAVA_HOME%" --gradle ^
          --sign "%cd%\signing\release.keystore" "%KEY_ALIAS%" ^
          --storepass "%KEYSTORE_PASSWORD%" --keypass "%KEY_PASSWORD%" --verbose

    # 8️⃣ Artifact + Release
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Knot-Android-arm64-v8a
        path: src/build/android-build/build/outputs/apk/release/*.apk

    - name: Upload to Release
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v2
      with:
        files: src/build/android-build/build/outputs/apk/release/*.apk