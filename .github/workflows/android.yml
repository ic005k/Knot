name: Android Build Test (Minimal v2)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  test-configure:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Qt 6.10.3 (Android arm64-v8a)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.3'
          host: 'windows'
          target: 'android'
          arch: 'android_arm64_v8a'
          modules: 'qtwebsockets qtwebchannel'
          cache: true

      - name: Install NDK r27c
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c
          add-to-path: false

      - name: Set Environment Variables
        shell: pwsh
        run: |
          echo "ANDROID_NDK_ROOT=${{ steps.setup-ndk.outputs.ndk-path }}" >> $env:GITHUB_ENV
          echo "QT_ROOT_DIR=${{ env.QT_ROOT_DIR }}" >> $env:GITHUB_ENV

      - name: Diagnostic - Verify CRT Files Exist
        shell: pwsh
        run: |
          $ndkRoot = $env:ANDROID_NDK_ROOT
          Write-Host "=== NDK CRT Diagnostic Info ==="
          Write-Host "NDK Root: $ndkRoot"

          $crtFile = Get-ChildItem -Path $ndkRoot -Recurse -Filter "crtbegin_dynamic.o" -ErrorAction SilentlyContinue |
                     Where-Object { $_.FullName -match "aarch64" } |
                     Select-Object -First 1

          if ($crtFile) {
            Write-Host "✅ Found crtbegin_dynamic.o at:"
            Write-Host "   $($crtFile.FullName)"
          } else {
            Write-Warning "⚠️ crtbegin_dynamic.o not found (non-fatal, continuing...)"
          }

          $api34Lib = Join-Path $ndkRoot "toolchains\llvm\prebuilt\windows-x86_64\sysroot\usr\lib\aarch64-linux-android\34"
          if (Test-Path $api34Lib) {
            Write-Host "✅ API 34 lib directory exists: $api34Lib"
            Get-ChildItem $api34Lib -Filter "libc.*" | ForEach-Object { Write-Host "   $($_.Name)" }
          } else {
            Write-Warning "⚠️ API 34 lib directory NOT found at: $api34Lib"
          }
          Write-Host "================================"

      - name: CMake Configure (Android arm64-v8a)
        shell: pwsh
        run: |
          $qtCmake = Join-Path $env:QT_ROOT_DIR "bin\qt-cmake.bat"
          if (-not (Test-Path $qtCmake)) {
            $qtCmake = Join-Path $env:QT_ROOT_DIR "bin\cmake.exe"
          }

          if (-not (Test-Path $qtCmake)) {
            Write-Error "::error::Cannot find qt-cmake or cmake in QT_ROOT_DIR: $env:QT_ROOT_DIR"
            exit 1
          }

          Write-Host "Using CMake: $qtCmake"
          Write-Host "ANDROID_NDK_ROOT: $env:ANDROID_NDK_ROOT"
          Write-Host "QT_ROOT_DIR: $env:QT_ROOT_DIR"

          & $qtCmake `
            -B build-android-test `
            -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DANDROID_ABI=arm64-v8a `
            -DANDROID_PLATFORM=android-34 `
            -DANDROID_STL=c++_shared `
            "-DANDROID_NDK_ROOT=$env:ANDROID_NDK_ROOT"

          if ($LASTEXITCODE -ne 0) {
            Write-Error "::error::CMake Configure failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }

          Write-Host "🎉 CMake Configure succeeded!"