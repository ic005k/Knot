name: Android CI (CMake)

on:
  push:
    branches: [ main ]
    paths:
      - '**'
      - '!stats.txt'
      - '!README.md'
  pull_request:
    paths:
      - '**'
  release:
    types: [ published ]

env:
  QT_VERSION: "6.10.3"
  QT_ARCH_ANDROID: "android_arm64_v8a"
  QT_ARCH_DESKTOP: "win64_mingw"
  NDK_VERSION: "26.1.10909125"  # 【改动1】回归真实 r26b，不再仿冒 r27
  ANDROID_API_LEVEL: "34"
  JAVA_VERSION: "17"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          path: 'src'

      # 1. 安装JDK（保持不变）
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}

      # 2. 安装NDK（保持手动下载逻辑，仅移除重命名步骤）
      - name: Install NDK
        shell: pwsh
        run: |
          $ndkUrl = "https://dl.google.com/android/repository/android-ndk-r26b-windows.zip"
          Invoke-WebRequest -Uri $ndkUrl -OutFile "ndk.zip"
          Expand-Archive -Path "ndk.zip" -DestinationPath "android-sdk\ndk" -Force
          # 【改动1】直接使用解压后的真实目录名，不再 Rename-Item 仿冒 r27
          $ndkPath = "${{ github.workspace }}\android-sdk\ndk\android-ndk-r26b"
          echo "ANDROID_NDK_HOME=$ndkPath" >> $env:GITHUB_ENV
          echo "$ndkPath\toolchains\llvm\prebuilt\windows-x86_64\bin" >> $env:GITHUB_PATH

      # 3. 安装桌面版Qt（保持不变）
      - name: Install Desktop Qt
        run: |
          python -m pip install --upgrade aqtinstall
          aqt install-qt windows desktop ${{ env.QT_VERSION }} ${{ env.QT_ARCH_DESKTOP }} `
            -m qtcharts qtsensors qtwebview qtlocation qtwebchannel qt5compat qtpositioning qtmultimedia `
            --outputdir "${{ github.workspace }}/Qt"

      # 4. 安装Android版Qt（保持不变）
      - name: Install Android Qt
        run: |
          aqt install-qt windows android ${{ env.QT_VERSION }} ${{ env.QT_ARCH_ANDROID }} `
            -m qtcharts qtsensors qtwebview qtlocation qtwebchannel qt5compat qtpositioning qtmultimedia `
            --outputdir "${{ github.workspace }}/Qt"

      # 5. 【改动2】CMake 配置与构建（替代原 qmake + make）
      - name: CMake Configure & Build
        shell: pwsh
        run: |
          $qtAndroid = "${{ github.workspace }}/Qt/${{ env.QT_VERSION }}/${{ env.QT_ARCH_ANDROID }}"
          $qtDesktop = "${{ github.workspace }}/Qt/${{ env.QT_VERSION }}/${{ env.QT_ARCH_DESKTOP }}"

          cd src
          cmake -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$qtAndroid" `
            -DQT_HOST_PATH="$qtDesktop" `
            -DCMAKE_TOOLCHAIN_FILE="$qtAndroid/lib/cmake/Qt6/qt.toolchain.cmake" `
            -DANDROID_ABI=arm64-v8a `
            -DANDROID_NATIVE_API_LEVEL=${{ env.ANDROID_API_LEVEL }} `
            -DANDROID_NDK_HOME="$env:ANDROID_NDK_HOME"

          cmake --build build --config Release -j8

      # 6. 【改动3】CMake 内置 APK 目标（替代手动复制.so + 手动 androiddeployqt）
      - name: Generate and Sign APK
        shell: pwsh
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd src/build

          # 解码 Keystore（逻辑与原脚本一致）
          $ksDir = "${{ github.workspace }}/signing"
          New-Item -ItemType Directory -Force -Path $ksDir | Out-Null
          $ksPath = "$ksDir/release.keystore"
          [Convert]::FromBase64String($env:KEYSTORE_BASE64) | Set-Content -Path $ksPath -Encoding Byte
          if ((Get-Item $ksPath).Length -lt 100) { throw "Keystore 解码异常" }

          # CMake apk 目标 = androiddeployqt + 自动复制.so + 签名
          cmake --build . --target apk --config Release -- `
            -DQT_ANDROID_KEYSTORE_PATH="$ksPath" `
            -DQT_ANDROID_KEYSTORE_ALIAS="$env:KEY_ALIAS" `
            -DQT_ANDROID_KEYSTORE_STORE_PASS="$env:KEYSTORE_PASSWORD" `
            -DQT_ANDROID_KEYSTORE_KEY_PASS="$env:KEY_PASSWORD" `
            -DQT_ANDROID_SIGN=ON

      # 7. 上传 Artifact（路径与原版一致，无需修改）
      - name: Upload signed APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Knot-APK-signed
          path: src/build/android-build/build/outputs/apk/release/*.apk

      # 8. 上传到 GitHub Release（保持不变）
      - name: Upload to GitHub Release
        if: github.event_name == 'release'
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: src/build/android-build/build/outputs/apk/release/*.apk
          asset_name: android-build-release-signed.apk
          tag: ${{ github.ref_name }}
          overwrite: true