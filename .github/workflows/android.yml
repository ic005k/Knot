name: Android CI (CMake)

on:
  push:
    branches: [ main ]
    paths-ignore: [ 'stats.txt', 'README.md' ]
  pull_request:
  release:
    types: [ published ]

env:
  QT_VERSION: "6.10.3"
  QT_ARCH: "android_arm64_v8a"
  HOST_ARCH: "win64_msvc2022_64"
  NDK_VERSION: "27.2.12479018"
  ANDROID_API_LEVEL: "34"
  JAVA_VERSION: "17"
  BUILD_TYPE: "Release"
  CMAKE_VERSION: "3.28.1"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
      with:
        path: src

    - name: Setup JDK
      uses: actions/setup-java@v4
      with:
        distribution: zulu
        java-version: ${{ env.JAVA_VERSION }}

    - name: Install CMake 3.28 (LTS)
      uses: lukka/get-cmake@latest
      with:
        cmakeVersion: ${{ env.CMAKE_VERSION }}

    - name: Install NDK
      shell: pwsh
      run: |
        $ndkUrl = "https://dl.google.com/android/repository/android-ndk-r27c-windows.zip"
        Invoke-WebRequest -Uri $ndkUrl -OutFile ndk.zip
        Expand-Archive ndk.zip -DestinationPath android-sdk\ndk
        Rename-Item android-sdk\ndk\android-ndk-r27c $env:NDK_VERSION
        $ndkRoot = "$env:GITHUB_WORKSPACE\android-sdk\ndk\$env:NDK_VERSION"
        echo "ANDROID_NDK_ROOT=$ndkRoot" >> $env:GITHUB_ENV
        echo "$ndkRoot\prebuilt\windows-x86_64\bin" >> $env:GITHUB_PATH

    - name: Install Ninja
      run: choco install ninja

    - name: Install Host Qt (MSVC2022)
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ env.QT_VERSION }}
        host: windows
        target: desktop
        arch: ${{ env.HOST_ARCH }}
        modules: qtcharts qtsensors qtwebview qtlocation qtwebchannel qt5compat qtpositioning qtmultimedia
        cache: true
        setup-python: false

    - name: Install Android Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ env.QT_VERSION }}
        host: windows
        target: android
        arch: ${{ env.QT_ARCH }}
        modules: qtcharts qtsensors qtwebview qtlocation qtwebchannel qt5compat qtpositioning qtmultimedia
        cache: true
        setup-python: false

    - name: CMake Configure
      shell: pwsh
      run: |
        Set-Location "$env:GITHUB_WORKSPACE\src"

        $ndkRoot = "$env:ANDROID_NDK_ROOT"
        $apiLevel = "${{ env.ANDROID_API_LEVEL }}"
        $androidPlatform = "android-$apiLevel"

        # 验证 CRT 文件
        $crtPath = "$ndkRoot\toolchains\llvm\prebuilt\windows-x86_64\sysroot\usr\lib\aarch64-linux-android\$apiLevel\crtbegin_dynamic.o"
        if (-not (Test-Path $crtPath)) {
          Write-Error "CRT not found: $crtPath"
          exit 1
        }

        # 强制指定 target（关键）
        $env:ANDROID_PLATFORM = $androidPlatform

        qt-cmake -B build `
          -G Ninja `
          -DCMAKE_BUILD_TYPE=$env:BUILD_TYPE `
          -DANDROID_ABI=arm64-v8a `
          -DANDROID_PLATFORM=$androidPlatform `
          -DANDROID_STL=c++_shared `
          -DANDROID_NDK_ROOT="$ndkRoot" `
          -DCMAKE_ANDROID_ARCH_ABI=arm64-v8a `
          -DCMAKE_ANDROID_API_LEVEL=$apiLevel `
          -DCMAKE_SYSTEM_NAME=Android `
          -DCMAKE_SYSTEM_VERSION=$apiLevel

    - name: CMake Build
      shell: pwsh
      run: |
        Set-Location "$env:GITHUB_WORKSPACE\src"
        cmake --build build --config $env:BUILD_TYPE --parallel $env:NUMBER_OF_PROCESSORS

    - name: Package & Sign APK
      shell: cmd
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        cd "%GITHUB_WORKSPACE%\src"

        set "DEPLOY_QT=%QT_ROOT_DIR%\bin\androiddeployqt.exe"
        if not exist "%DEPLOY_QT%" (
          echo ::error::androiddeployqt not found & exit 1
        )

        set "JSON=build\android-Knot-deployment-settings.json"
        if not exist "%JSON%" (
          echo ::error::deployment-settings.json not found & exit 1
        )

        mkdir signing
        cd signing
        PowerShell -Command "[IO.File]::WriteAllBytes('release.keystore', [Convert]::FromBase64String($env:KEYSTORE_BASE64))"
        cd ..

        "%DEPLOY_QT%" ^
          --input "%JSON%" ^
          --output build\android-build ^
          --android-platform android-%ANDROID_API_LEVEL% ^
          --jdk "%JAVA_HOME%" ^
          --gradle ^
          --sign "%cd%\signing\release.keystore" "%KEY_ALIAS%" ^
          --storepass "%KEYSTORE_PASSWORD%" ^
          --keypass "%KEY_PASSWORD%" ^
          --verbose

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Knot-Android-arm64-v8a
        path: src/build/android-build/build/outputs/apk/release/*.apk

    - name: Upload to Release
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v2
      with:
        files: src/build/android-build/build/outputs/apk/release/*.apk