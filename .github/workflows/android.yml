name: Android CI (CMake)

on:
  push:
    branches: [main]
    paths: ['**', '!stats.txt', '!README.md']
  pull_request:
    paths: ['**']
  release:
    types: [published]

env:
  QT_VERSION: "6.10.3"
  QT_ARCH_ANDROID: "android_arm64_v8a"
  DESKTOP_ARCH: "win64_mingw"
  NDK_VERSION: "r27c"
  ANDROID_API_LEVEL: "34"
  JAVA_VERSION: "17"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Enable Windows Long Paths
        shell: pwsh
        run: reg add "HKLM\SYSTEM\CurrentControlSet\Control\FileSystem" /v LongPathsEnabled /t REG_DWORD /d 1 /f

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install NDK
        shell: pwsh
        run: |
          $ndkUrl = "https://dl.google.com/android/repository/android-ndk-${{ env.NDK_VERSION }}-windows.zip"
          Invoke-WebRequest -Uri $ndkUrl -OutFile "ndk.zip"
          Expand-Archive -Path "ndk.zip" -DestinationPath "android-sdk\ndk" -Force
          $ndkPath = "${{ github.workspace }}\android-sdk\ndk\android-ndk-${{ env.NDK_VERSION }}"
          echo "ANDROID_NDK_HOME=$ndkPath" >> $env:GITHUB_ENV
          echo "$ndkPath\toolchains\llvm\prebuilt\windows-x86_64\bin" >> $env:GITHUB_PATH

      - name: Install Desktop Qt
        shell: pwsh
        run: |
          python -m pip install --upgrade aqtinstall
          aqt install-qt windows desktop ${{ env.QT_VERSION }} ${{ env.DESKTOP_ARCH }} `
            -m qtcharts qtsensors qtwebview qtlocation qtwebchannel qt5compat qtpositioning qtmultimedia `
            --outputdir "${{ github.workspace }}/Qt"

      - name: Install Android Qt
        shell: pwsh
        run: |
          aqt install-qt windows android ${{ env.QT_VERSION }} ${{ env.QT_ARCH_ANDROID }} `
            -m qtcharts qtsensors qtwebview qtlocation qtwebchannel qt5compat qtpositioning qtmultimedia `
            --outputdir "${{ github.workspace }}/Qt"

      - name: Decode Keystore
        shell: pwsh
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          $ksDir = "${{ github.workspace }}/signing"
          New-Item -ItemType Directory -Force -Path $ksDir | Out-Null
          $ksPath = "$ksDir/release.keystore"
          $bytes = [Convert]::FromBase64String($env:KEYSTORE_BASE64)
          [IO.File]::WriteAllBytes($ksPath, $bytes)
          if ((Get-Item $ksPath).Length -lt 100) {
            throw "Keystore 解码异常，文件大小: $((Get-Item $ksPath).Length) bytes"
          }
          Write-Host "✅ Keystore decoded: $((Get-Item $ksPath).Length) bytes"
          echo "KEYSTORE_PATH=$ksPath" >> $env:GITHUB_ENV

      - name: CMake Configure & Build
        shell: pwsh
        run: |
          $qtBase = "${{ github.workspace }}/Qt/${{ env.QT_VERSION }}"
          $qtAndroid = "$qtBase/${{ env.QT_ARCH_ANDROID }}"

          $desktopCandidates = @("${{ env.DESKTOP_ARCH }}", "mingw_64", "mingw1310_64", "gcc_64")
          $qtDesktop = ""
          foreach ($candidate in $desktopCandidates) {
            $testPath = Join-Path $qtBase $candidate
            if (Test-Path "$testPath/bin/moc.exe") {
              $qtDesktop = $testPath
              Write-Host "✅ Found Desktop Qt at: $qtDesktop"
              break
            }
          }
          if ([string]::IsNullOrEmpty($qtDesktop)) {
            Get-ChildItem $qtBase -Directory | ForEach-Object { Write-Host "  - $($_.Name)" }
            throw "❌ Cannot find Desktop Qt!"
          }

          cmake -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$qtAndroid" `
            -DQT_HOST_PATH="$qtDesktop" `
            -DCMAKE_TOOLCHAIN_FILE="$qtAndroid/lib/cmake/Qt6/qt.toolchain.cmake" `
            -DANDROID_ABI=arm64-v8a `
            -DANDROID_NATIVE_API_LEVEL=${{ env.ANDROID_API_LEVEL }} `
            -DANDROID_PLATFORM=${{ env.ANDROID_API_LEVEL }} `
            -DANDROID_NDK_HOME="$env:ANDROID_NDK_HOME"

          cmake --build build --config Release -j8

      # ✅ 终极方案：生成 APK → 解压删除冗余 → 重压缩 → 重签名
      - name: Build APK (Deploy + Strip + Sign)
        shell: pwsh
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          $qtBase = "${{ github.workspace }}/Qt/${{ env.QT_VERSION }}"
          $desktopCandidates = @("${{ env.DESKTOP_ARCH }}", "mingw_64", "mingw1310_64", "gcc_64")
          $qtDesktop = ""
          foreach ($candidate in $desktopCandidates) {
            $testPath = Join-Path $qtBase $candidate
            if (Test-Path "$testPath/bin/androiddeployqt.exe") {
              $qtDesktop = $testPath
              break
            }
          }
          if ([string]::IsNullOrEmpty($qtDesktop)) { throw "❌ Cannot find androiddeployqt.exe!" }

          $deployQt = "$qtDesktop/bin/androiddeployqt.exe"
          $settingsFile = Get-ChildItem "build/" -Filter "*deployment-settings.json" | Select-Object -First 1
          if (-not $settingsFile) { throw "❌ No deployment-settings.json found!" }

          # 1️⃣ 运行 androiddeployqt 生成 android-build 目录
          Write-Host "🚀 Running androiddeployqt (prepare only)..."
          & $deployQt --input $settingsFile.FullName --output "${{ github.workspace }}/build/android-build" --android-platform "android-${{ env.ANDROID_API_LEVEL }}" --jdk "$env:JAVA_HOME" --release --verbose

          # 2️⃣ 调用 Gradle 生成未签名的 APK（先不签名）
          Write-Host "`n📦 Building unsigned APK..."
          Push-Location "${{ github.workspace }}/build/android-build"
          & ./gradlew assembleRelease --no-daemon
          Pop-Location

          # 3️⃣ 找到未签名的 APK
          $apkPath = Get-ChildItem "build/android-build/build/outputs/apk/release/*-unsigned.apk" | Select-Object -First 1
          if (-not $apkPath) { throw "❌ Unsigned APK not found!" }
          Write-Host "📦 Found unsigned APK: $($apkPath.Name) ($([math]::Round($apkPath.Length/1MB, 2)) MB)"

          # 4️⃣ 解压 APK → 精确删除冗余文件 → 重新压缩
          Write-Host "`n🔧 Stripping bloat from APK..."
          $stripDir = "${{ github.workspace }}/build/apk-strip"
          if (Test-Path $stripDir) { Remove-Item -Recurse -Force $stripDir }
          Expand-Archive -Path $apkPath.FullName -DestinationPath $stripDir -Force

          # ⚠️ 根据 Diagnose APK Size 输出的真实路径填写
          $stripPatterns = @(
              "org",
              "mapsforge",
              "tencentmap",
              "patterns",
              "symbols"
          )

          foreach ($pattern in $stripPatterns) {
              $matched = Get-ChildItem -Path $stripDir -Recurse -Directory -Filter $pattern -ErrorAction SilentlyContinue
              foreach ($item in $matched) {
                  Remove-Item -Recurse -Force $item.FullName
                  Write-Host "🗑️ Stripped dir: $($item.FullName.Replace($stripDir, 'apk://'))"
              }
              # 也匹配文件
              $matchedFiles = Get-ChildItem -Path $stripDir -Recurse -File -Filter "*$pattern*" -ErrorAction SilentlyContinue
              foreach ($file in $matchedFiles) {
                  Remove-Item -Force $file.FullName
                  Write-Host "🗑️ Stripped file: $($file.FullName.Replace($stripDir, 'apk://'))"
              }
          }

          # 重新压缩为 APK（ZIP 格式）
          $strippedApk = "${{ github.workspace }}/build/stripped-release.apk"
          Compress-Archive -Path "$stripDir/*" -DestinationPath $strippedApk -Force
          Write-Host "📦 Stripped APK size: $([math]::Round((Get-Item $strippedApk).Length/1MB, 2)) MB"

          # 5️⃣ 使用 apksigner 重新签名
          Write-Host "`n✍️ Re-signing stripped APK..."
          $apksigner = Get-ChildItem "$env:JAVA_HOME/bin/apksigner*" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $apksigner) {
              # 如果 apksigner 不在 JAVA_HOME，尝试用 jarsigner
              $jarsigner = "$env:JAVA_HOME/bin/jarsigner.exe"
              if (-not (Test-Path $jarsigner)) { throw "❌ jarsigner not found in JAVA_HOME!" }

              & $jarsigner `
                -keystore "$env:KEYSTORE_PATH" `
                -storepass "$env:KEYSTORE_PASSWORD" `
                -keypass "$env:KEY_PASSWORD" `
                -signedjar "${{ github.workspace }}/build/Knot-signed-stripped.apk" `
                $strippedApk `
                "$env:KEY_ALIAS"

              # 验证签名
              & $jarsigner -verify "${{ github.workspace }}/build/Knot-signed-stripped.apk"
          } else {
              & $apksigner.FullName sign `
                --ks "$env:KEYSTORE_PATH" `
                --ks-pass "pass:$env:KEYSTORE_PASSWORD" `
                --key-pass "pass:$env:KEY_PASSWORD" `
                --ks-key-alias "$env:KEY_ALIAS" `
                --out "${{ github.workspace }}/build/Knot-signed-stripped.apk" `
                $strippedApk

              & $apksigner.FullName verify "${{ github.workspace }}/build/Knot-signed-stripped.apk"
          }
          Write-Host "✅ Signed & stripped APK ready."

      - name: Diagnose APK Size
        shell: pwsh
        run: |
          # 优先检查 stripped 版本
          $apk = Get-ChildItem "build/Knot-signed-stripped.apk" -ErrorAction SilentlyContinue
          if (-not $apk) {
            Write-Host "⚠️ Stripped APK not found, falling back to original..."
            $apk = Get-ChildItem "build/android-build/build/outputs/apk/release/*.apk" | Select-Object -First 1
          }
          if (-not $apk) {
            Write-Host "⚠️ No APK found"; exit 0
          }
          Write-Host "📦 APK: $($apk.Name) ($([math]::Round($apk.Length/1MB, 2)) MB)"
          Add-Type -Assembly System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead($apk.FullName)
          Write-Host "`n🔍 Top 15 largest entries:"
          $zip.Entries | Sort-Object Length -Descending | Select-Object -First 15 |
            Format-Table @{L='Size(MB)';E={[math]::Round($_.Length/1MB,2)}}, FullName -AutoSize
          $zip.Dispose()

      - name: Upload signed APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Knot-APK-signed
          path: |
            build/Knot-signed-stripped.apk
            build/android-build/build/outputs/apk/release/*.apk

      - name: Upload to GitHub Release
        if: github.event_name == 'release'
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: build/Knot-signed-stripped.apk
          asset_name: Knot-release.apk
          tag: ${{ github.ref_name }}
          overwrite: true