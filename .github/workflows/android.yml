name: Android CI (CMake)

on:
  push:
    branches: [ main ]
    paths-ignore: [ 'stats.txt', 'README.md' ]
  pull_request:
  release:
    types: [ published ]

env:
  QT_VERSION: "6.10.3"
  QT_ARCH: "android_arm64_v8a"
  HOST_ARCH: "win64_msvc2019_64"
  NDK_VERSION: "27.2.12479018"
  ANDROID_API_LEVEL: "34"
  JAVA_VERSION: "17"
  BUILD_TYPE: "Release"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
      with:
        path: src

    # ✅ 1. JDK
    - name: Setup JDK
      uses: actions/setup-java@v4
      with:
        distribution: zulu
        java-version: ${{ env.JAVA_VERSION }}

    # ✅ 2. MSVC（必须，否则 Qt MSVC 不完整）
    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    # ✅ 3. NDK
    - name: Install NDK
      shell: pwsh
      run: |
        $ndk = "https://dl.google.com/android/repository/android-ndk-r27c-windows.zip"
        Invoke-WebRequest $ndk -OutFile ndk.zip
        Expand-Archive ndk.zip -DestinationPath android-sdk\ndk
        Rename-Item android-sdk\ndk\android-ndk-r27c $env:NDK_VERSION
        echo "ANDROID_NDK_ROOT=$env:GITHUB_WORKSPACE\android-sdk\ndk\$env:NDK_VERSION" >> $env:GITHUB_ENV

    # ✅ 4. Qt（MSVC Host + Android Target）
    - name: Install Qt
      shell: pwsh
      run: |
        pip install aqtinstall

        aqt install-qt windows desktop $env:QT_VERSION $env:HOST_ARCH `
          -m qtcharts qtsensors qtwebview qtlocation qtwebchannel qt5compat qtpositioning qtmultimedia `
          --outputdir "$env:GITHUB_WORKSPACE\Qt"

        aqt install-qt windows android $env:QT_VERSION $env:QT_ARCH `
          -m qtcharts qtsensors qtwebview qtlocation qtwebchannel qt5compat qtpositioning qtmultimedia `
          --outputdir "$env:GITHUB_WORKSPACE\Qt"

    # ✅ 5. CMake Configure（qt-cmake.bat，官方推荐）
    - name: CMake Configure
      shell: pwsh
      run: |
        $hostQt = "$env:GITHUB_WORKSPACE\Qt\$env:QT_VERSION\$env:HOST_ARCH"
        Set-Location "$env:GITHUB_WORKSPACE\src"

        & "$hostQt\bin\qt-cmake.bat" -B build `
          -G Ninja `
          -DCMAKE_BUILD_TYPE=$env:BUILD_TYPE `
          -DANDROID_ABI=arm64-v8a `
          -DANDROID_PLATFORM=android-$env:ANDROID_API_LEVEL `
          -DANDROID_STL=c++_shared

    # ✅ 6. CMake Build
    - name: CMake Build
      shell: pwsh
      run: |
        Set-Location "$env:GITHUB_WORKSPACE\src"
        cmake --build build --config $env:BUILD_TYPE --parallel $env:NUMBER_OF_PROCESSORS

    # ✅ 7. APK 打包 & 签名（与你 qmake 流程等价）
    - name: Package & Sign APK
      shell: cmd
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        cd "%GITHUB_WORKSPACE%\src"

        set "HOST_QT=%GITHUB_WORKSPACE%\Qt\%QT_VERSION%\%HOST_ARCH%"
        set "DEPLOY_QT=%HOST_QT%\bin\androiddeployqt.exe"

        if not exist "%DEPLOY_QT%" (
          echo ::error::androiddeployqt not found & exit 1
        )

        set "JSON=build\android-Knot-deployment-settings.json"
        if not exist "%JSON%" (
          echo ::error::deployment-settings.json not found & exit 1
        )

        mkdir signing
        cd signing
        PowerShell -Command "[IO.File]::WriteAllBytes('release.keystore', [Convert]::FromBase64String($env:KEYSTORE_BASE64))"
        cd ..

        "%DEPLOY_QT%" ^
          --input "%JSON%" ^
          --output build\android-build ^
          --android-platform android-%ANDROID_API_LEVEL% ^
          --jdk "%JAVA_HOME%" ^
          --gradle ^
          --sign "%cd%\signing\release.keystore" "%KEY_ALIAS%" ^
          --storepass "%KEYSTORE_PASSWORD%" ^
          --keypass "%KEY_PASSWORD%" ^
          --verbose

    # ✅ 8. 上传 Artifact
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Knot-Android-arm64-v8a
        path: src/build/android-build/build/outputs/apk/release/*.apk

    # ✅ 9. 上传 Release
    - name: Upload to Release
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v2
      with:
        files: src/build/android-build/build/outputs/apk/release/*.apk