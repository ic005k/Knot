name: Android CI (CMake)

on:
  push:
    branches: [main]
    paths:
      - '**'
      - '!stats.txt'
      - '!README.md'
  pull_request:
    paths:
      - '**'
  release:
    types: [published]

env:
  QT_VERSION: "6.10.3"
  QT_ARCH_ANDROID: "android_arm64_v8a"
  DESKTOP_ARCH: "win64_mingw"
  NDK_VERSION: "27.2.12479018"
  ANDROID_API_LEVEL: "34"
  JAVA_VERSION: "17"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Enable Windows Long Paths
        shell: pwsh
        run: |
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\FileSystem" /v LongPathsEnabled /t REG_DWORD /d 1 /f

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install NDK
        shell: pwsh
        run: |
          $ndkUrl = "https://dl.google.com/android/repository/android-ndk-r26b-windows.zip"
          Invoke-WebRequest -Uri $ndkUrl -OutFile "ndk.zip"
          Expand-Archive -Path "ndk.zip" -DestinationPath "android-sdk\ndk" -Force
          $ndkPath = "${{ github.workspace }}\android-sdk\ndk\android-ndk-r26b"
          echo "ANDROID_NDK_HOME=$ndkPath" >> $env:GITHUB_ENV
          echo "$ndkPath\toolchains\llvm\prebuilt\windows-x86_64\bin" >> $env:GITHUB_PATH

      - name: Install Desktop Qt
        shell: pwsh
        run: |
          python -m pip install --upgrade aqtinstall
          aqt install-qt windows desktop ${{ env.QT_VERSION }} ${{ env.DESKTOP_ARCH }} `
            -m qtcharts qtsensors qtwebview qtlocation qtwebchannel qt5compat qtpositioning qtmultimedia `
            --outputdir "${{ github.workspace }}/Qt"

      - name: Install Android Qt
        shell: pwsh
        run: |
          aqt install-qt windows android ${{ env.QT_VERSION }} ${{ env.QT_ARCH_ANDROID }} `
            -m qtcharts qtsensors qtwebview qtlocation qtwebchannel qt5compat qtpositioning qtmultimedia `
            --outputdir "${{ github.workspace }}/Qt"

      - name: Decode Keystore
        shell: pwsh
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          $ksDir = "${{ github.workspace }}/signing"
          New-Item -ItemType Directory -Force -Path $ksDir | Out-Null
          $ksPath = "$ksDir/release.keystore"
          $bytes = [Convert]::FromBase64String($env:KEYSTORE_BASE64)
          [IO.File]::WriteAllBytes($ksPath, $bytes)
          if ((Get-Item $ksPath).Length -lt 100) {
            throw "Keystore 解码异常，文件大小: $((Get-Item $ksPath).Length) bytes"
          }
          Write-Host "✅ Keystore decoded: $((Get-Item $ksPath).Length) bytes"
          echo "KEYSTORE_PATH=$ksPath" >> $env:GITHUB_ENV

      - name: CMake Configure & Build
        shell: pwsh
        run: |
          $qtBase = "${{ github.workspace }}/Qt/${{ env.QT_VERSION }}"
          $qtAndroid = "$qtBase/${{ env.QT_ARCH_ANDROID }}"

          $desktopCandidates = @("${{ env.DESKTOP_ARCH }}", "mingw_64", "mingw1310_64", "gcc_64")
          $qtDesktop = ""
          foreach ($candidate in $desktopCandidates) {
            $testPath = Join-Path $qtBase $candidate
            if (Test-Path "$testPath/bin/moc.exe") {
              $qtDesktop = $testPath
              Write-Host "✅ Found Desktop Qt at: $qtDesktop"
              break
            }
          }

          if ([string]::IsNullOrEmpty($qtDesktop)) {
            Write-Host "❌ Cannot find Desktop Qt! Listing available directories:"
            Get-ChildItem $qtBase -Directory | ForEach-Object { Write-Host "  - $($_.Name)" }
            throw "QT_HOST_PATH not found."
          }

          cmake -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$qtAndroid" `
            -DQT_HOST_PATH="$qtDesktop" `
            -DCMAKE_TOOLCHAIN_FILE="$qtAndroid/lib/cmake/Qt6/qt.toolchain.cmake" `
            -DANDROID_ABI=arm64-v8a `
            -DANDROID_NATIVE_API_LEVEL=${{ env.ANDROID_API_LEVEL }} `
            -DANDROID_PLATFORM=${{ env.ANDROID_API_LEVEL }} `
            -DANDROID_NDK_HOME="$env:ANDROID_NDK_HOME"

          cmake --build build --config Release -j8

      - name: Build APK (Manual androiddeployqt)
        shell: pwsh
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          $qtBase = "${{ github.workspace }}/Qt/${{ env.QT_VERSION }}"

          # ✅ androiddeployqt 是 Host 工具，必须在 Desktop Qt 目录中查找
          $desktopCandidates = @("${{ env.DESKTOP_ARCH }}", "mingw_64", "mingw1310_64", "gcc_64")
          $qtDesktop = ""
          foreach ($candidate in $desktopCandidates) {
            $testPath = Join-Path $qtBase $candidate
            if (Test-Path "$testPath/bin/androiddeployqt.exe") {
              $qtDesktop = $testPath
              Write-Host "✅ Found Desktop Qt at: $qtDesktop"
              break
            }
          }

          if ([string]::IsNullOrEmpty($qtDesktop)) {
            throw "❌ Cannot find Desktop Qt with androiddeployqt.exe!"
          }

          $deployQt = "$qtDesktop/bin/androiddeployqt.exe"
          Write-Host "🔧 Using: $deployQt"

          # 查找 deployment settings json
          $settingsFile = Get-ChildItem "build/" -Filter "*deployment-settings.json" | Select-Object -First 1
          if (-not $settingsFile) {
            throw "❌ No deployment-settings.json found in build/"
          }
          Write-Host "📄 Settings: $($settingsFile.FullName)"

          # ✅ 将密码写入临时文件，避免 env: 语法在 CI 非交互终端中失效
          $passFile = Join-Path $env:RUNNER_TEMP "sign_pass.txt"
          [IO.File]::WriteAllText($passFile, $env:KEY_PASSWORD)
          Write-Host "🔑 Password file created at: $passFile"

          try {
            Write-Host "🚀 Running androiddeployqt with --release ..."
            & $deployQt `
              --input $settingsFile.FullName `
              --output "${{ github.workspace }}/build/android-build" `
              --android-platform "android-${{ env.ANDROID_API_LEVEL }}" `
              --jdk "$env:JAVA_HOME" `
              --gradle `
              --release `
              --sign "${{ env.KEYSTORE_PATH }}" "$env:KEY_ALIAS" --signpass "file:$passFile" `
              --verbose
          } finally {
            # ✅ 无论成功失败都立即删除密码文件
            if (Test-Path $passFile) {
              Remove-Item $passFile -Force
              Write-Host "🗑️ Password file cleaned up."
            }
          }

          Write-Host "✅ APK built. Checking outputs:"
          Get-ChildItem "build/android-build/build/outputs/apk/release/" -ErrorAction SilentlyContinue

      - name: Diagnose APK Size
        shell: pwsh
        run: |
          $apk = Get-ChildItem "build/android-build/build/outputs/apk/release/*.apk" | Select-Object -First 1
          if (-not $apk) {
            Write-Host "⚠️ No APK found in release output directory."
            exit 0
          }
          Write-Host "📦 APK: $($apk.Name) ($([math]::Round($apk.Length/1MB, 2)) MB)"
          Add-Type -Assembly System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead($apk.FullName)
          Write-Host "`n🔍 Top 15 largest entries:"
          $topEntries = $zip.Entries | Sort-Object Length -Descending | Select-Object -First 15
          $topEntries | Format-Table @{L='Size(MB)';E={[math]::Round($_.Length/1MB,2)}}, FullName -AutoSize
          $zip.Dispose()

      - name: Upload signed APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Knot-APK-signed
          path: build/android-build/build/outputs/apk/release/*.apk

      - name: Upload to GitHub Release
        if: github.event_name == 'release'
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: build/android-build/build/outputs/apk/release/*.apk
          asset_name: android-build-release-signed.apk
          tag: ${{ github.ref_name }}
          overwrite: true