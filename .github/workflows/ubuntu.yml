name: Linux

on:
  push:
    branches: [main]
    paths:
      - "**"
      - "!stats.txt"
      - "!README.md"

  pull_request:
    paths:
      - "**"

  release:
    types: [published]

jobs:
  build:
    name: Build
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    strategy:
      matrix:
        os: [ubuntu-22.04]
        qt_ver: [6.10.3]
        qt_arch: [gcc_64]

    env:
      targetName: Knot
      orgName: Knot
      ONEDRIVE_SECRET: ${{ secrets.ONEDRIVE_SECRET }}
      QT_VERSION: ${{ matrix.qt_ver }}
      QT_ARCH: gcc_64
      QT_INSTALL_DIR: /opt/qt/QT_VERSION/gcc_64

    steps:
      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{ matrix.qt_ver }}
          cached: "false"
          modules: qtcharts qtsensors qtlocation qtwebchannel qt5compat qtpositioning qtmultimedia

      - name: Install Qt6 GTK platform theme
        run: |
          # 安装系统 Qt6 GTK 主题包（提供 libqgtk3.so）
          sudo apt-get install -y qt6-gtk-platformtheme

          # 查找 Qt 安装目录（不依赖 QT_ROOT_DIR，使用与其他步骤一致的路径）
          QT_DIR="/home/runner/work/Knot/Qt/${{ matrix.qt_ver }}/gcc_64"

          # 如果标准路径不存在，尝试自动查找
          if [ ! -d "$QT_DIR" ]; then
            QT_DIR=$(find $HOME -name "qml" -type d -path "*Qt/${{ matrix.qt_ver }}/gcc_64" 2>/dev/null | head -1)
          fi
          if [ -z "$QT_DIR" ] || [ ! -d "$QT_DIR" ]; then
            QT_DIR=$(find /opt -name "qml" -type d -path "*Qt/${{ matrix.qt_ver }}/gcc_64" 2>/dev/null | head -1)
          fi

          if [ ! -d "$QT_DIR" ]; then
            echo "ERROR: 无法找到 Qt 安装目录"
            exit 1
          fi

          echo "Found Qt at: $QT_DIR"

          # 先检查 qt.io 的 Qt 是否已自带 platformthemes 插件
          echo "=== qt.io Qt 中的 platformthemes ==="
          ls -la "$QT_DIR/plugins/platformthemes/" 2>/dev/null || echo "目录不存在或为空"

          # 复制系统 GTK 平台主题插件到 Qt 目录
          mkdir -p "$QT_DIR/plugins/platformthemes"
          find /usr/lib/x86_64-linux-gnu/qt6/plugins/platformthemes/ -name "*.so" -exec cp {} "$QT_DIR/plugins/platformthemes/" \;
          echo "=== 复制后的 qt.io Qt platformthemes ==="
          ls -la "$QT_DIR/plugins/platformthemes/"

          # 同时复制到 bin/release 目录（作为 linuxdeployqt 的备用来源）
          mkdir -p bin/release/plugins/platformthemes
          cp "$QT_DIR/plugins/platformthemes/"*.so bin/release/plugins/platformthemes/ 2>/dev/null || true
          echo "=== bin/release/plugins/platformthemes ==="
          ls -la bin/release/plugins/platformthemes/

          # 设置 QT_ROOT_DIR 供后续步骤使用
          echo "QT_ROOT_DIR=$QT_DIR" >> $GITHUB_ENV

      - name: ubuntu install GL library
        run: |
          sudo apt-get install -y libglew-dev libglfw3-dev libxcb*
          sudo apt-get install libxkbcommon-dev
          sudo add-apt-repository universe
          sudo apt install libfuse2
          sudo apt-get install libsecret-1-dev
          sudo apt-get install -y libqt6serialport6
          sudo apt-get install -y libibus-1.0-dev ibus libglib2.0-dev

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ========== 提取版本号（从 CMakeLists.txt 读取真实版本） ==========
      - name: Extract version from CMakeLists.txt
        id: version
        run: |
          APP_VER=$(grep -oP 'project\(\w+\s+VERSION\s+\K[\d.]+' CMakeLists.txt)
          if [ -z "$APP_VER" ]; then
            echo "ERROR: 无法从 CMakeLists.txt 提取版本号"
            exit 1
          fi
          echo "Extracted version: $APP_VER"
          echo "APP_VERSION=$APP_VER" >> $GITHUB_ENV
          echo "version=$APP_VER" >> $GITHUB_OUTPUT

      - name: build ubuntu
        run: |
          cmake -B build \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
          cmake --build build --config Release --parallel 2
          mkdir -p bin/release
          if [ ! -f "bin/release/${{ env.targetName }}" ]; then
            cp "build/${{ env.targetName }}" "bin/release/${{ env.targetName }}"
          fi
          chmod +x "bin/release/${{ env.targetName }}"
          ls -la "bin/release/${{ env.targetName }}"
          file "bin/release/${{ env.targetName }}"

      - name: install linuxdeployqt
        run: |
          wget -c -nv "https://github.com/probonopd/linuxdeployqt/releases/download/continuous/linuxdeployqt-continuous-x86_64.AppImage"
          chmod a+x linuxdeployqt-continuous-x86_64.AppImage

      - name: Remove unused SQL drivers (SAFE MODE)
        run: |
          export PATH="$QT_ROOT_DIR/bin:$PATH"
          QT_PLUGINS_DIR=$(qmake -query QT_INSTALL_PLUGINS)
          mkdir -p /tmp/qt-drivers-backup
          cp "$QT_PLUGINS_DIR/sqldrivers/"* /tmp/qt-drivers-backup/
          find "$QT_PLUGINS_DIR/sqldrivers" \
            -name "libqsql*.so" \
            ! -name "*sqlite*" \
            ! -name "*SQLite*" \
            -delete
          ls -l "$QT_PLUGINS_DIR/sqldrivers"

      # ========== 打包 1/4: AppImage ==========
      - name: package AppImage
        run: |
          cp res/icon.png bin/release/icon.png
          cp res/default.desktop bin/release/default.desktop
          cp ExtBin/linux/AppRun bin/release/AppRun
          chmod +x bin/release/AppRun

          APP_LIB_DIR="bin/release/lib"
          mkdir -p "$APP_LIB_DIR"

          cp ExtBin/linux/fcitx5/libFcitx5Qt6DBusAddons.so.5.1.9 "$APP_LIB_DIR/"
          cp ExtBin/linux/fcitx5/libfcitx5platforminputcontextplugin.so "$APP_LIB_DIR/"
          (cd "$APP_LIB_DIR" && \
          ln -sf libFcitx5Qt6DBusAddons.so.5.1.9 libFcitx5Qt6DBusAddons.so.1 && \
          ln -sf libFcitx5Qt6DBusAddons.so.1 libFcitx5Qt6DBusAddons.so)

          QT6_PLUGINS_DIR="/home/runner/work/Knot/Qt/$QT_VERSION/gcc_64/plugins/platforminputcontexts"
          mkdir -p "$QT6_PLUGINS_DIR"
          cp ExtBin/linux/fcitx5/* "$QT6_PLUGINS_DIR/"
          chmod 755 "$QT6_PLUGINS_DIR/"
          (cd "$QT6_PLUGINS_DIR/" && \
          ln -sf libFcitx5Qt6DBusAddons.so.5.1.9 libFcitx5Qt6DBusAddons.so.1 && \
          ln -sf libFcitx5Qt6DBusAddons.so.1 libFcitx5Qt6DBusAddons.so)

          cp -r ExtBin/linux/nss/* bin/release/lib/
          cp -P /usr/lib/x86_64-linux-gnu/libssl.so.3* bin/release/lib/

          APP_PLUGINS_DIR="bin/release/plugins/platforminputcontexts"
          mkdir -p "$APP_PLUGINS_DIR"
          cp ExtBin/linux/fcitx5/* "$APP_PLUGINS_DIR/"
          (cd "$APP_PLUGINS_DIR" && \
          ln -sf libFcitx5Qt6DBusAddons.so.5.1.9 libFcitx5Qt6DBusAddons.so.1 && \
          ln -sf libFcitx5Qt6DBusAddons.so.1 libFcitx5Qt6DBusAddons.so)

          cp /usr/lib/x86_64-linux-gnu/libibus-1.0.so.5 "$APP_LIB_DIR/"
          (cd "$APP_LIB_DIR" && ln -sf libibus-1.0.so.5 libibus-1.0.so)

          cp "$QT6_PLUGINS_DIR/libibusplatforminputcontextplugin.so" "$APP_PLUGINS_DIR/"
          chmod 755 "$APP_PLUGINS_DIR/libibusplatforminputcontextplugin.so"

          export LD_LIBRARY_PATH="/home/runner/work/Knot/Qt/$QT_VERSION/gcc_64/plugins/platforminputcontexts:$APP_LIB_DIR:$LD_LIBRARY_PATH"
          export QT_IM_MODULE=ibus
          export QT_QPA_PLATFORM_PLUGIN_PATH="/home/runner/work/Knot/Qt/$QT_VERSION/gcc_64/plugins/platforms"

          ./linuxdeployqt-continuous-x86_64.AppImage bin/release/${{ env.targetName }} \
                   -unsupported-allow-new-glibc \
                   -qmake=/home/runner/work/Knot/Qt/${{ matrix.qt_ver }}/gcc_64/bin/qmake \
                   -appimage \
                   -extra-plugins=platformthemes,platforminputcontexts \
                   -no-strip

      # ========== 打包 2/4: tar.gz (便携压缩包) ==========
      - name: package tar.gz (portable)
        run: |
          # linuxdeployqt -appimage 直接把 bin/release 当作 AppDir 根
          if [ ! -d "bin/release" ] || [ ! -f "bin/release/AppRun" ]; then
            echo "ERROR: bin/release 不是有效 AppDir（缺少 AppRun）"
            ls -la bin/release/ || true
            exit 1
          fi

          rm -rf "${{ env.targetName }}-Linux-x86_64"
          cp -a bin/release "${{ env.targetName }}-Linux-x86_64"
          chmod +x "${{ env.targetName }}-Linux-x86_64/AppRun"

          tar -czf "${{ env.targetName }}-${{ env.APP_VERSION }}-x86_64.tar.gz" \
                    "${{ env.targetName }}-Linux-x86_64"

          ls -lh "${{ env.targetName }}-${{ env.APP_VERSION }}-x86_64.tar.gz"
          tar -tzf "${{ env.targetName }}-${{ env.APP_VERSION }}-x86_64.tar.gz" | head -30

      # ========== 打包 3/4: .deb (Debian/Ubuntu) ==========
      - name: package deb
        run: |
          sudo apt-get install -y dpkg
          if [ ! -d "bin/release" ]; then
            echo "ERROR: 未找到 bin/release"
            exit 1
          fi

          DEB_ROOT="deb-pkg/${{ env.targetName }}"
          rm -rf "deb-pkg"
          mkdir -p "$DEB_ROOT/DEBIAN"
          mkdir -p "$DEB_ROOT/opt/${{ env.targetName }}"
          mkdir -p "$DEB_ROOT/usr/bin"
          mkdir -p "$DEB_ROOT/usr/share/applications"
          mkdir -p "$DEB_ROOT/usr/share/icons/hicolor/256x256/apps"
          mkdir -p "$DEB_ROOT/usr/share/icons/hicolor/128x128/apps"
          mkdir -p "$DEB_ROOT/usr/share/icons/hicolor/48x48/apps"

          # --- 复制应用文件 ---
          cp -a bin/release/. "$DEB_ROOT/opt/${{ env.targetName }}/"

          # --- 创建 /usr/bin 符号链接 ---
          ln -s "/opt/${{ env.targetName }}/AppRun" "$DEB_ROOT/usr/bin/${{ env.targetName }}"

          # --- 生成完整的 .desktop 文件（heredoc 终止标记必须与脚本同级，剥离后顶格）---
          cat > "$DEB_ROOT/usr/share/applications/${{ env.targetName }}.desktop" << 'DESKTOPEOF'
          [Desktop Entry]
          Type=Application
          Name=Knot
          GenericName=Text Editor
          Comment=A cross-platform Qt application
          Exec=/opt/Knot/AppRun %f
          Icon=Knot
          Terminal=false
          Categories=Utility;TextEditor;Development;
          MimeType=text/plain;text/markdown;text/x-c;application/x-shellscript;
          StartupNotify=true
          Keywords=text;editor;markdown;qt;
          DESKTOPEOF

          # --- 安装图标（多尺寸，桌面环境按需查找）---
          if [ -f "bin/release/icon.png" ]; then
            cp bin/release/icon.png "$DEB_ROOT/usr/share/icons/hicolor/256x256/apps/${{ env.targetName }}.png"
            cp bin/release/icon.png "$DEB_ROOT/usr/share/icons/hicolor/128x128/apps/${{ env.targetName }}.png"
            cp bin/release/icon.png "$DEB_ROOT/usr/share/icons/hicolor/48x48/apps/${{ env.targetName }}.png"
          fi

          # --- 计算安装大小 ---
          INSTALLED_SIZE=$(du -sk "$DEB_ROOT" | cut -f1)

          # --- 生成 DEBIAN/control（使用真实版本号）---
          {
            echo "Package: ${{ env.targetName }}"
            echo "Version: ${{ env.APP_VERSION }}"
            echo "Section: x11"
            echo "Priority: optional"
            echo "Architecture: amd64"
            echo "Maintainer: GitHub Actions <actions@github.com>"
            echo "Description: ${{ env.targetName }} - Qt Application"
            echo " A cross-platform Qt application."
            echo "Homepage: https://github.com/${{ github.repository }}"
            echo "Installed-Size: $INSTALLED_SIZE"
          } > "$DEB_ROOT/DEBIAN/control"

          dpkg-deb --build --root-owner-group "$DEB_ROOT" \
            "${{ env.targetName }}_${{ env.APP_VERSION }}_amd64.deb"

          ls -lh "${{ env.targetName }}_${{ env.APP_VERSION }}_amd64.deb"

      # ========== 打包 4/4: .rpm (Fedora/openSUSE/RHEL) ==========
      - name: package rpm
        run: |
          sudo apt-get install -y rpm
          if [ ! -d "bin/release" ]; then
            echo "ERROR: 未找到 bin/release"
            exit 1
          fi

          RPM_WORK="$PWD/rpmbuild-work"
          rm -rf "$RPM_WORK"
          mkdir -p "$RPM_WORK"/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          cp -a bin/release "$RPM_WORK/SOURCES/${{ env.targetName }}-Linux-x86_64"

          # --- 将 desktop 和 icon 也放入 SOURCES（heredoc 终止标记必须与脚本同级）---
          cat > "$RPM_WORK/SOURCES/${{ env.targetName }}.desktop" << 'DESKTOPEOF'
          [Desktop Entry]
          Type=Application
          Name=Knot
          GenericName=Text Editor
          Comment=A cross-platform Qt application
          Exec=/opt/Knot/AppRun %f
          Icon=Knot
          Terminal=false
          Categories=Utility;TextEditor;Development;
          MimeType=text/plain;text/markdown;text/x-c;application/x-shellscript;
          StartupNotify=true
          Keywords=text;editor;markdown;qt;
          DESKTOPEOF

          if [ -f "bin/release/icon.png" ]; then
            cp bin/release/icon.png "$RPM_WORK/SOURCES/${{ env.targetName }}.png"
          fi

          # --- 生成 spec 文件（使用真实版本号 + 完整文件列表）---
          {
            echo "Name: ${{ env.targetName }}"
            echo "Version: ${{ env.APP_VERSION }}"
            echo "Release: 1"
            echo "Summary: ${{ env.targetName }} - Qt Application"
            echo "License: MIT"
            echo "URL: https://github.com/${{ github.repository }}"
            echo "BuildArch: x86_64"
            echo "Requires: hicolor-icon-theme"
            echo ""
            echo "%description"
            echo "${{ env.targetName }} application for Linux."
            echo ""
            echo "%install"
            # 应用主文件
            echo "mkdir -p %{buildroot}/opt/${{ env.targetName }}"
            echo "cp -a $RPM_WORK/SOURCES/${{ env.targetName }}-Linux-x86_64/. %{buildroot}/opt/${{ env.targetName }}/"
            # 符号链接
            echo "mkdir -p %{buildroot}/usr/bin"
            echo "ln -s /opt/${{ env.targetName }}/AppRun %{buildroot}/usr/bin/${{ env.targetName }}"
            # desktop 文件
            echo "mkdir -p %{buildroot}/usr/share/applications"
            echo "install -m 644 $RPM_WORK/SOURCES/${{ env.targetName }}.desktop \\"
            echo "  %{buildroot}/usr/share/applications/${{ env.targetName }}.desktop"
            # 图标（多尺寸）
            echo "if [ -f $RPM_WORK/SOURCES/${{ env.targetName }}.png ]; then"
            echo "  mkdir -p %{buildroot}/usr/share/icons/hicolor/256x256/apps"
            echo "  mkdir -p %{buildroot}/usr/share/icons/hicolor/128x128/apps"
            echo "  mkdir -p %{buildroot}/usr/share/icons/hicolor/48x48/apps"
            echo "  install -m 644 $RPM_WORK/SOURCES/${{ env.targetName }}.png \\"
            echo "    %{buildroot}/usr/share/icons/hicolor/256x256/apps/${{ env.targetName }}.png"
            echo "  install -m 644 $RPM_WORK/SOURCES/${{ env.targetName }}.png \\"
            echo "    %{buildroot}/usr/share/icons/hicolor/128x128/apps/${{ env.targetName }}.png"
            echo "  install -m 644 $RPM_WORK/SOURCES/${{ env.targetName }}.png \\"
            echo "    %{buildroot}/usr/share/icons/hicolor/48x48/apps/${{ env.targetName }}.png"
            echo "fi"
            echo ""
            echo "%files"
            echo "/opt/${{ env.targetName }}"
            echo "/usr/bin/${{ env.targetName }}"
            echo "%{_datadir}/applications/${{ env.targetName }}.desktop"
            echo "%{_datadir}/icons/hicolor/256x256/apps/${{ env.targetName }}.png"
            echo "%{_datadir}/icons/hicolor/128x128/apps/${{ env.targetName }}.png"
            echo "%{_datadir}/icons/hicolor/48x48/apps/${{ env.targetName }}.png"
          } > "$RPM_WORK/SPECS/${{ env.targetName }}.spec"

          rpmbuild -bb "$RPM_WORK/SPECS/${{ env.targetName }}.spec" \
                   --define "_topdir $RPM_WORK"

          RPM_FILE=$(find "$RPM_WORK/RPMS" -name "${{ env.targetName }}-*.rpm" | head -1)
          if [ -z "$RPM_FILE" ]; then
            echo "ERROR: rpm file not generated"
            find "$RPM_WORK" -name "*.rpm" || true
            exit 1
          fi
          cp "$RPM_FILE" \
             "${{ env.targetName }}-${{ env.APP_VERSION }}-1.x86_64.rpm"
          ls -lh "${{ env.targetName }}-${{ env.APP_VERSION }}-1.x86_64.rpm"

      # ========== 上传 Artifacts ==========
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.orgName }}-${{ env.APP_VERSION }}-x86_64.AppImage
          path: ${{ env.targetName }}-${{ env.APP_VERSION }}-x86_64.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.orgName }}-${{ env.APP_VERSION }}-x86_64.tar.gz
          path: ${{ env.targetName }}-${{ env.APP_VERSION }}-x86_64.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.orgName }}-${{ env.APP_VERSION }}-amd64.deb
          path: ${{ env.targetName }}_${{ env.APP_VERSION }}_amd64.deb

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.orgName }}-${{ env.APP_VERSION }}-x86_64.rpm
          path: ${{ env.targetName }}-${{ env.APP_VERSION }}-1.x86_64.rpm

      # ========== 上传 Release ==========
      - name: uploadRelease (AppImage)
        if: github.event_name == 'release'
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ env.targetName }}-${{ env.APP_VERSION }}-x86_64.AppImage
          asset_name: ${{ env.orgName }}-${{ env.APP_VERSION }}-x86_64.AppImage
          tag: ${{ github.ref }}
          overwrite: true

      - name: uploadRelease (tar.gz)
        if: github.event_name == 'release'
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ env.targetName }}-${{ env.APP_VERSION }}-x86_64.tar.gz
          asset_name: ${{ env.orgName }}-${{ env.APP_VERSION }}-x86_64.tar.gz
          tag: ${{ github.ref }}
          overwrite: true

      - name: uploadRelease (deb)
        if: github.event_name == 'release'
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ env.targetName }}_${{ env.APP_VERSION }}_amd64.deb
          asset_name: ${{ env.orgName }}-${{ env.APP_VERSION }}-amd64.deb
          tag: ${{ github.ref }}
          overwrite: true

      - name: uploadRelease (rpm)
        if: github.event_name == 'release'
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ env.targetName }}-${{ env.APP_VERSION }}-1.x86_64.rpm
          asset_name: ${{ env.orgName }}-${{ env.APP_VERSION }}-x86_64.rpm
          tag: ${{ github.ref }}
          overwrite: true
