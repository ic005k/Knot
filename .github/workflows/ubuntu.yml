name: Linux

on:
  push:
    branches: [main]
    paths:
      - '**'
      - '!stats.txt'
      - '!README.md'

  pull_request:
    paths:
      - '**'

  release:
    types: [published]

jobs:
  build:
    name: Build
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    strategy:
      matrix:
        os: [ubuntu-22.04]
        qt_ver: [6.10.3]
        qt_arch: [gcc_64]

    env:
      targetName: Knot
      VERSION: Linux
      orgName: Knot
      ONEDRIVE_SECRET: ${{ secrets.ONEDRIVE_SECRET }}
      QT_VERSION: ${{ matrix.qt_ver }}
      QT_ARCH: gcc_64
      QT_INSTALL_DIR: /opt/qt/QT_VERSION/gcc_64
      QT_INSTALL_QML: /opt/qt/QT_VERSION/gcc_64/qml
      QML2_IMPORT_PATH: ${{ github.workspace }}/qml:/opt/qt/QT_VERSION/gcc_64/qml

    steps:
      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{ matrix.qt_ver }}
          cached: 'false'
          #modules: qtcharts qtsensors qtwebview qtlocation qtwebchannel qt5compat qtpositioning qtmultimedia
          modules: qtcharts qtsensors qtlocation qtwebchannel qt5compat qtpositioning qtmultimedia

      - name: ubuntu install GL library
        run: |
          sudo apt-get install -y libglew-dev libglfw3-dev libxcb*
          sudo apt-get install libxkbcommon-dev
          sudo add-apt-repository universe
          sudo apt install libfuse2
          sudo apt-get install libsecret-1-dev
          sudo apt-get install -y libqt6serialport6
          sudo apt-get install -y libibus-1.0-dev ibus libglib2.0-dev

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: build ubuntu
        run: |
          cmake -B build \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"

          # ✅ 限制为2线程并行，防止OOM（ubuntu-22.04只有7GB RAM）
          cmake --build build --config Release --parallel 2

          echo "=== 对齐产物路径 ==="
          mkdir -p bin/release

          # ✅ 兼容两种情况：如果CMake已直接输出到bin/release则跳过复制
          if [ ! -f "bin/release/${{ env.targetName }}" ]; then
            echo "未在 bin/release 找到产物，尝试从 build 目录复制..."
            cp "build/${{ env.targetName }}" "bin/release/${{ env.targetName }}"
          else
            echo "产物已在 bin/release 目录中，跳过复制"
          fi

          chmod +x "bin/release/${{ env.targetName }}"

          echo "=== 验证产物 ==="
          ls -la bin/release/${{ env.targetName }}
          file bin/release/${{ env.targetName }}

      - name: install linuxdeployqt
        run: |
          wget -c -nv "https://github.com/probonopd/linuxdeployqt/releases/download/continuous/linuxdeployqt-continuous-x86_64.AppImage"
          chmod a+x linuxdeployqt-continuous-x86_64.AppImage

      - name: Remove unused SQL drivers (SAFE MODE)
        run: |
          export PATH="$QT_ROOT_DIR/bin:$PATH"
          QT_PLUGINS_DIR=$(qmake -query QT_INSTALL_PLUGINS)
          mkdir -p /tmp/qt-drivers-backup
          cp "$QT_PLUGINS_DIR/sqldrivers/"* /tmp/qt-drivers-backup/
          echo "已备份驱动到: /tmp/qt-drivers-backup"
          find "$QT_PLUGINS_DIR/sqldrivers" \
            -name "libqsql*.so" \
            ! -name "*sqlite*" \
            ! -name "*SQLite*" \
            -delete
          echo "当前SQL驱动:"
          ls -l "$QT_PLUGINS_DIR/sqldrivers"
          echo "SQLite驱动状态:"
          ldd "$QT_PLUGINS_DIR/sqldrivers/libqsqlite.so" || true

      - name: package
        run: |
          cp res/icon.png bin/release/icon.png
          cp res/default.desktop bin/release/default.desktop
          cp ExtBin/linux/AppRun bin/release/AppRun
          chmod +x bin/release/AppRun

          APP_LIB_DIR="bin/release/lib"
          mkdir -p "$APP_LIB_DIR"

          cp ExtBin/linux/fcitx5/libFcitx5Qt6DBusAddons.so.5.1.9 "$APP_LIB_DIR/"
          cp ExtBin/linux/fcitx5/libfcitx5platforminputcontextplugin.so "$APP_LIB_DIR/"

          (cd "$APP_LIB_DIR" && \
          ln -sf libFcitx5Qt6DBusAddons.so.5.1.9 libFcitx5Qt6DBusAddons.so.1 && \
          ln -sf libFcitx5Qt6DBusAddons.so.1 libFcitx5Qt6DBusAddons.so)

          QT6_PLUGINS_DIR="/home/runner/work/Knot/Qt/$QT_VERSION/gcc_64/plugins/platforminputcontexts"
          mkdir -p "$QT6_PLUGINS_DIR"
          cp ExtBin/linux/fcitx5/* "$QT6_PLUGINS_DIR/"
          chmod 755 "$QT6_PLUGINS_DIR/"

          (cd "$QT6_PLUGINS_DIR/" && \
          ln -sf libFcitx5Qt6DBusAddons.so.5.1.9 libFcitx5Qt6DBusAddons.so.1 && \
          ln -sf libFcitx5Qt6DBusAddons.so.1 libFcitx5Qt6DBusAddons.so)

          echo "Copied to: $QT6_PLUGINS_DIR"
          ls -l "$QT6_PLUGINS_DIR"

          cp -r ExtBin/linux/nss/* bin/release/lib/
          cp -P /usr/lib/x86_64-linux-gnu/libssl.so.3* bin/release/lib/

          APP_PLUGINS_DIR="bin/release/plugins/platforminputcontexts"
          mkdir -p "$APP_PLUGINS_DIR"
          cp ExtBin/linux/fcitx5/* "$APP_PLUGINS_DIR/"

          (cd "$APP_PLUGINS_DIR" && \
          ln -sf libFcitx5Qt6DBusAddons.so.5.1.9 libFcitx5Qt6DBusAddons.so.1 && \
          ln -sf libFcitx5Qt6DBusAddons.so.1 libFcitx5Qt6DBusAddons.so)

          cp /usr/lib/x86_64-linux-gnu/libibus-1.0.so.5 "$APP_LIB_DIR/"
          (cd "$APP_LIB_DIR" && ln -sf libibus-1.0.so.5 libibus-1.0.so)

          cp "$QT6_PLUGINS_DIR/libibusplatforminputcontextplugin.so" "$APP_PLUGINS_DIR/"
          chmod 755 "$APP_PLUGINS_DIR/libibusplatforminputcontextplugin.so"

          export LD_LIBRARY_PATH="/home/runner/work/Knot/Qt/$QT_VERSION/gcc_64/plugins/platforminputcontexts:$APP_LIB_DIR:$LD_LIBRARY_PATH"
          export QT_IM_MODULE=ibus
          export QT_QPA_PLATFORM_PLUGIN_PATH="/home/runner/work/Knot/Qt/$QT_VERSION/gcc_64/plugins/platforms"
          export VERSION

          ./linuxdeployqt-continuous-x86_64.AppImage bin/release/${targetName} \
                   -unsupported-allow-new-glibc \
                   -qmldir=/home/runner/work/Knot/Knot/src/qmlsrc \
                   -qmake=/home/runner/work/Knot/Qt/${{ matrix.qt_ver }}/gcc_64/bin/qmake \
                   -appimage \
                   -extra-plugins=platforminputcontexts \
                   -no-strip

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.orgName }}-${{ env.VERSION }}-x86_64.AppImage
          path: ${{ env.targetName }}-${{ env.VERSION }}-x86_64.AppImage

      - name: uploadRelease
        if: github.event_name == 'release'
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ env.targetName }}-${{ env.VERSION }}-x86_64.AppImage
          asset_name: ${{ env.orgName }}-${{ env.VERSION }}-x86_64.AppImage
          tag: ${{ github.ref }}
          overwrite: true