name: Linux

on:
  push:
    branches: [main]
    paths:
      - '**'
      - '!stats.txt'
      - '!README.md'

  pull_request:
    paths:
      - '**'

  release:
    types: [published]

jobs:
  build:
    name: Build
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    strategy:
      matrix:
        os: [ubuntu-22.04]
        qt_ver: [6.10.3]
        qt_arch: [gcc_64]

    env:
      targetName: Knot
      VERSION: Linux
      orgName: Knot
      ONEDRIVE_SECRET: ${{ secrets.ONEDRIVE_SECRET }}
      QT_VERSION: ${{ matrix.qt_ver }}
      QT_ARCH: gcc_64
      QT_INSTALL_DIR: /opt/qt/QT_VERSION/gcc_64

      #QT_INSTALL_QML: /opt/qt/QT_VERSION/gcc_64/qml
      #QML2_IMPORT_PATH: ${{ github.workspace }}/qml:/opt/qt/QT_VERSION/gcc_64/qml

    steps:
      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{ matrix.qt_ver }}
          cached: 'false'
          modules: qtcharts qtsensors qtlocation qtwebchannel qt5compat qtpositioning qtmultimedia

      - name: ubuntu install GL library
        run: |
          sudo apt-get install -y libglew-dev libglfw3-dev libxcb*
          sudo apt-get install libxkbcommon-dev
          sudo add-apt-repository universe
          sudo apt install libfuse2
          sudo apt-get install libsecret-1-dev
          sudo apt-get install -y libqt6serialport6
          sudo apt-get install -y libibus-1.0-dev ibus libglib2.0-dev

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: build ubuntu
        run: |
          cmake -B build \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
          cmake --build build --config Release --parallel 2
          echo "=== 对齐产物路径 ==="
          mkdir -p bin/release
          if [ ! -f "bin/release/${{ env.targetName }}" ]; then
            cp "build/${{ env.targetName }}" "bin/release/${{ env.targetName }}"
          else
            echo "产物已在 bin/release 目录中，跳过复制"
          fi
          chmod +x "bin/release/${{ env.targetName }}"
          echo "=== 验证产物 ==="
          ls -la bin/release/${{ env.targetName }}
          file bin/release/${{ env.targetName }}

      - name: install linuxdeployqt
        run: |
          wget -c -nv "https://github.com/probonopd/linuxdeployqt/releases/内部工具/continuous/linuxdeployqt-continuous-x86_64.AppImage"
          chmod a+x linuxdeployqt-continuous-x86_64.AppImage

      - name: Remove unused SQL drivers (SAFE MODE)
        run: |
          export PATH="$QT_ROOT_DIR/bin:$PATH"
          QT_PLUGINS_DIR=$(qmake -query QT_INSTALL_PLUGINS)
          mkdir -p /tmp/qt-drivers-backup
          cp "$QT_PLUGINS_DIR/sqldrivers/"* /tmp/qt-drivers-backup/
          echo "已备份驱动到: /tmp/qt-drivers-backup"
          find "$QT_PLUGINS_DIR/sqldrivers" \
            -name "libqsql*.so" \
            ! -name "*sqlite*" \
            ! -name "*SQLite*" \
            -delete
          echo "当前SQL驱动:"
          ls -l "$QT_PLUGINS_DIR/sqldrivers"
          echo "SQLite驱动状态:"
          ldd "$QT_PLUGINS_DIR/sqldrivers/libqsqlite.so" || true

      # ========== 打包 1/4: AppImage ==========
      - name: package AppImage
        run: |
          cp resicon.png binicon.png
          cp res/default.desktop bin/release/default.desktop
          cp ExtBin/linux/AppRun bin/release/AppRun
          chmod +x bin/release/AppRun

          APP_LIB_DIR="bin/release/lib"
          mkdir -p "$APP_LIB_DIR"

          cp ExtBin/linux/fcitx5/libFcitx5Qt6DBusAddons.so.5.1.9 "$APP_LIB_DIR/"
          cp ExtBin/linux/fcitx5/libfcitx5platforminputcontextplugin.so "$APP_LIB_DIR/"

          (cd "$APP_LIB_DIR" && \
          ln -sf libFcitx5Qt6DBusAddons.so.5.1.9 libFcitx5Qt6DBusAddons.so.1 && \
          ln -sf libFcitx5Qt6DBusAddons.so.1 libFcitx5Qt6DBusAddons.so)

          QT6_PLUGINS_DIR="/home/runner/work/Knot/Qt/$QT_VERSION/gcc_64/plugins/platforminputcontexts"
          mkdir -p "$QT6_PLUGINS_DIR"
          cp ExtBin/linux/fcitx5/* "$QT6_PLUGINS_DIR/"
          chmod 755 "$QT6_PLUGINS_DIR/"

          (cd "$QT6_PLUGINS_DIR/" && \
          ln -sf libFcitx5Qt6DBusAddons.so.5.1.9 libFcitx5Qt6DBusAddons.so.1 && \
          ln -sf libFcitx5Qt6DBusAddons.so.1 libFcitx5Qt6DBusAddons.so)

          echo "Copied to: $QT6_PLUGINS_DIR"
          ls -l "$QT6_PLUGINS_DIR"

          cp -r ExtBin/linux/nss/* bin/release/lib/
          cp -P /usr/lib/x86_64-linux-gnu/libssl.so.3* bin/release/lib/

          APP_PLUGINS_DIR="bin/release/plugins/platforminputcontexts"
          mkdir -p "$APP_PLUGINS_DIR"
          cp ExtBin/linux/fcitx5/* "$APP_PLUGINS_DIR/"

          (cd "$APP_PLUGINS_DIR" && \
          ln -sf libFcitx5Qt6DBusAddons.so.5.1.9 libFcitx5Qt6DBusAddons.so.1 && \
          ln -sf libFcitx5Qt6DBusAddons.so.1 libFcitx5Qt6DBusAddons.so)

          cp /usr/lib/x86_64-linux-gnu/libibus-1.0.so.5 "$APP_LIB_DIR/"
          (cd "$APP_LIB_DIR" && ln -sf libibus-1.0.so.5 libibus-1.0.so)

          cp "$QT6_PLUGINS_DIR/libibusplatforminputcontextplugin.so" "$APP_PLUGINS_DIR/"
          chmod 755 "$APP_PLUGINS_DIR/libibusplatforminputcontextplugin.so"

          export LD_LIBRARY_PATH="/home/runner/work/Knot/Qt/$QT_VERSION/gcc_64/plugins/platforminputcontexts:$APP_LIB_DIR:$LD_LIBRARY_PATH"
          export QT_IM_MODULE=ibus
          export QT_QPA_PLATFORM_PLUGIN_PATH="/home/runner/work/Knot/Qt/$QT_VERSION/gcc_64/plugins/platforms"
          export VERSION

          ./linuxdeployqt-continuous-x86_64.AppImage bin/release/${{ env.targetName }} \
                   -unsupported-allow-new-glibc \
                   -qmake=/home/runner/work/Knot/Qt/${{ matrix.qt_ver }}/gcc_64/bin/qmake \
                   -appimage \
                   -extra-plugins=platforminputcontexts \
                   -no-strip

      # ========== 打包 2/4: tar.gz (便携压缩包) ==========
      - name: package tar.gz (portable)
        run: |
          # linuxdeployqt 的 -appimage 选项会同时生成 AppDir 目录
          if [ ! -d "AppDir" ]; then
            echo "ERROR: 未找到 AppDir/，请检查上面的 linuxdeployqt 步骤是否成功"
            exit 1
          fi

          # 清理旧的打包目录
          rm -rf "${{ env.targetName }}-Linux-x86_64"

          # 将 AppDir 内容复制到命名目录
          cp -r AppDir "${{ env.targetName }}-Linux-x86_64"

          # 确保 AppRun 有执行权限
          chmod +x "${{ env.targetName }}-Linux-x86_64/AppRun"

          # 打包为 tar.gz
          tar -czf "${{ env.targetName }}-${{ env.VERSION }}-x86_64.tar.gz" "${{ env.targetName }}-Linux-x86_64"

          echo "=== 产物 ==="
          ls -lh "${{ env.targetName }}-${{ env.VERSION }}-x86_64.tar.gz"
          echo "=== 归档预览 ==="
          tar -tzf "${{ env.targetName }}-${{ env.VERSION }}-x86_64.tar.gz" | head -30

      # ========== 打包 3/4: .deb (Debian/Ubuntu) ==========
      - name: package deb
        run: |
          which dpkg-deb || sudo apt-get install -y dpkg

          if [ ! -d "AppDir" ]; then
            echo "ERROR: 未找到 AppDir/，请先执行 AppImage 打包步骤"
            exit 1
          fi

          # 创建 deb 包目录结构
          DEB_PACKAGE="deb-pkg/${{ env.targetName }}"
          rm -rf "$DEB_PACKAGE"
          mkdir -p "$DEB_PACKAGE/DEBIAN"
          mkdir -p "$DEB_PACKAGE/opt/${{ env.targetName }}"
          mkdir -p "$DEB_PACKAGE/usr/bin"
          mkdir -p "$DEB_PACKAGE/usr/share/applications"
          mkdir -p "$DEB_PACKAGE/usr/share/icons/hicolor/256x256/apps"

          # 复制 AppDir 内容到 /opt/ 目录
          cp -r AppDir/* "$DEB_PACKAGE/opt/${{ env.targetName }}/"

          # 创建桌面启动器符号链接
          ln -s "/opt/${{ env.targetName }}/AppRun" "$DEB_PACKAGE/usr/bin/${{ env.targetName }}"

          # 复制桌面文件（如果 AppDir 中有）
          if ls AppDir/usr/share/applications/*.desktop 1>/dev/null 2>&1; then
            cp AppDir/usr/share/applications/*.desktop "$DEB_PACKAGE/usr/share/applications/"
          fi

          # 复制图标（如果 AppDir 中有）
          if ls AppDir*.png 1>/dev/null 2>&1; then
            cp AppDir*.png "$DEB_PACKAGE/usr/share/icons/hicolor/256x256/apps/"
          fi

          # 创建 control 文件
          cat > "$DEB_PACKAGE/DEBIAN/control" << DEOF
Package: ${{ env.targetName }}
Version: 1.0-${{ env.VERSION }}
Section: x11
Priority: optional
Architecture: amd64
Maintainer: GitHub Actions <actions@github.com>
Description: ${{ env.targetName }} - Qt Application
 A cross-platform Qt application.
Homepage: https://github.com/${{ github.repository }}
Installed-Size: $(du -sk "$DEB_PACKAGE" | cut -f1)
DEOF

          # 构建 deb 包
          dpkg-deb --build --root-owner-group "$DEB_PACKAGE" "${{ env.targetName }}_${{ env.VERSION }}_amd64.deb"

          echo "=== 产物 ==="
          ls -lh "${{ env.targetName }}_${{ env.VERSION }}_amd64.deb"

      # ========== 打包 4/4: .rpm (Fedora/openSUSE/RHEL) ==========
      - name: package rpm
        run: |
          sudo apt-get install -y rpm

          if [ ! -d "AppDir" ]; then
            echo "ERROR: 未找到 AppDir/，请先执行 AppImage 打包步骤"
            exit 1
          fi

          # 创建 rpmbuild 目录结构
          RPM_WORK=rpmbuild-work
          rm -rf "$RPM_WORK"
          mkdir -p "$RPM_WORK/{BUILD,RPMS,SOURCES,SPECS,SRPMS}"

          # 复制 AppDir 到 SOURCES 目录
          cp -r AppDir "$RPM_WORK/SOURCES/${{ env.targetName }}-Linux-x86_64"

          # 创建 spec 文件
          cat > "$RPM_WORK/SPECS/${{ env.targetName }}.spec" << SPEOF
Name:   ${{ env.targetName }}
Version: 1.0
Release: 1.${{ env.VERSION }}
Summary: ${{ env.targetName }} - Qt Application
License: MIT
URL: https://github.com/${{ github.repository }}
BuildArch: x86_64
BuildRoot: %{_tmppath}/%{name}-build

%description
${{ env.targetName }} application for Linux.

%install
mkdir -p %{buildroot}/opt/${{ env.targetName }}
cp -a $RPM_BUILD_DIR/${{ env.targetName }}-Linux-x86_64/* %{buildroot}/opt/${{ env.targetName }}/
mkdir -p %{buildroot}/usr/bin
ln -s /opt/${{ env.targetName }}/AppRun %{buildroot}/usr/bin/${{ env.targetName }}

%files
/opt/${{ env.targetName }}
/usr/bin/${{ env.targetName }}

%post
echo "Installed ${{ env.targetName }} to /opt/${{ env.targetName }}"

%preun
echo "Removing ${{ env.targetName }} from /opt/${{ env.targetName }}"
SPEOF

          # 构建 rpm 包
          rpmbuild -bb "$RPM_WORK/SPECS/${{ env.targetName }}.spec" \
                   --define "_topdir $RPM_WORK" \
                   --define "_buildrootdir $RPM_WORK/BUILD"

          # 查找生成的 rpm 文件
          RPM_FILE=$(find "$RPM_WORK/RPMS/x86_64/" -name "${{ env.targetName }}*.rpm" 2>/dev/null | head -1)
          if [ -z "$RPM_FILE" ]; then
            echo "ERROR: 未找到生成的 rpm 文件"
            ls -la "$RPM_WORK/RPMS/x86_64/" || echo "RPMS目录为空"
            exit 1
          fi

          cp "$RPM_FILE" "${{ env.targetName }}-1.0-${{ env.VERSION }}.x86_64.rpm"

          echo "=== 产物 ==="
          ls -lh "${{ env.targetName }}-1.0-${{ env.VERSION }}.x86_64.rpm"

      # ========== 上传 Artifacts ==========
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.orgName }}-${{ env.VERSION }}-x86_64.AppImage
          path: ${{ env.targetName }}-${{ env.VERSION }}-x86_64.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.orgName }}-${{ env.VERSION }}-x86_64.tar.gz
          path: ${{ env.targetName }}-${{ env.VERSION }}-x86_64.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.orgName }}-${{ env.VERSION }}-amd64.deb
          path: ${{ env.targetName }}_${{ env.VERSION }}_amd64.deb

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.orgName }}-${{ env.VERSION }}-x86_64.rpm
          path: ${{ env.targetName }}-1.0-${{ env.VERSION }}.x86_64.rpm

      # ========== 上传 Release (仅 tag 发布时) ==========
      - name: uploadRelease
        if: github.event_name == 'release'
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ env.targetName }}-${{ env.VERSION }}-x86_64.AppImage
          asset_name: ${{ env.orgName }}-${{ env.VERSION }}-x86_64.AppImage
          tag: ${{ github.ref }}
          overwrite: true

      - name: uploadRelease (tar.gz)
        if: github.event_name == 'release'
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ env.targetName }}-${{ env.VERSION }}-x86_64.tar.gz
          asset_name: ${{ env.orgName }}-${{ env.VERSION }}-x86_64.tar.gz
          tag: ${{ github.ref }}
          overwrite: true

      - name: uploadRelease (deb)
        if: github.event_name == 'release'
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ env.targetName }}_${{ env.VERSION }}_amd64.deb
          asset_name: ${{ env.orgName }}-${{ env.VERSION }}_amd64.deb
          tag: ${{ github.ref }}
          overwrite: true

      - name: uploadRelease (rpm)
        if: github.event_name == 'release'
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ env.targetName }}-1.0-${{ env.VERSION }}.x86_64.rpm
          asset_name: ${{ env.orgName }}-${{ env.VERSION }}-x86_64.rpm
          tag: ${{ github.ref }}
          overwrite: true