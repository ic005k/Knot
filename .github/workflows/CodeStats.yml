name: Code Stats
on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'

jobs:
  stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install cloc
        run: sudo apt-get install cloc
      - name: Count lines
        run: |
          cloc . --out=stats.txt
          cat stats.txt

      # ✅ 核心改动：推送到独立 stats 分支，而非 main
      - name: Push stats to stats branch
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          # 创建一个干净的单独分支（不含 main 的历史）
          git checkout --orphan stats
          git rm -rf .

          # 只保留 stats.txt
          git add stats.txt
          git commit -m "Update code stats $(date +'%Y-%m-%d %H:%M')" || echo "No changes"

          # 强制推送覆盖远程 stats 分支
          git push origin stats --force