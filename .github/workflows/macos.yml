name: MacOS-x86_64 CI

on:
  push:
    branches: [main]
    paths:
      - '**'
      - '!stats.txt'
      - '!README.md'
  pull_request:
    paths:
      - '**'
  release:
    types: [published]

jobs:
  build:
    name: Build-x86_64
    runs-on: macos-14
    permissions:
      contents: write

    strategy:
      matrix:
        qt_ver: ["6.9.3"]
        qt_arch: [clang_64]

    env:
      targetName: Knot
      VERSION: Mac-x86_64
      orgName: Knot
      ONEDRIVE_SECRET: ${{ secrets.ONEDRIVE_SECRET }}
      QT_ROOT_DIR: ${{ github.workspace }}/Qt/${{ matrix.qt_ver }}/macos

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{ matrix.qt_ver }}
          cached: false
          host: mac
          target: desktop
          arch: ${{ matrix.qt_arch }}
          modules: qtcharts qtsensors qtwebview qtlocation qtwebchannel qt5compat qtpositioning qtmultimedia
          install-deps: true
          source: false
          dir: ${{ github.workspace }}/Qt

      - name: Install OpenSSL & CMake
        run: |
          # macos-14 预装 arm64 Homebrew (/opt/homebrew)，直接使用
          brew install openssl@3 cmake

          OPENSSL_ROOT="$(brew --prefix openssl@3)"
          echo "OPENSSL_ROOT=$OPENSSL_ROOT" >> $GITHUB_ENV

          # 验证 OpenSSL 是否可用
          echo "=== Verify OpenSSL ==="
          echo "OpenSSL prefix: $OPENSSL_ROOT"
          ls "$OPENSSL_ROOT/lib/" || true

      - name: Build macOS (x86_64)
        timeout-minutes: 60
        run: |
          export PATH="/opt/homebrew/bin:$PATH"
          OSX_SYSROOT="$(xcrun --sdk macosx --show-sdk-path)"
          QT_LIB_PATH="${{ github.workspace }}/Qt/${{ matrix.qt_ver }}/macos/lib"
          if [ ! -d "$QT_LIB_PATH" ]; then
            QT_LIB_PATH="$QT_ROOT_DIR/lib"
          fi

          echo "=== Environment Info ==="
          echo "OpenSSL Root: $OPENSSL_ROOT"
          echo "macOS SDK:    $OSX_SYSROOT"
          echo "Runner Arch:  $(uname -m)"
          echo "Rosetta:      $(arch)"
          echo "Qt Lib Path:  $QT_LIB_PATH"
          echo "QT_ROOT_DIR:  $QT_ROOT_DIR"

          echo "=== Diagnostic: Qt Core Architecture ==="
          file "$QT_LIB_PATH/QtCore.framework/QtCore" || true

          echo "=== Diagnostic: OpenSSL Architecture ==="
          file "$OPENSSL_ROOT/lib/libssl.dylib" || true
          file "$OPENSSL_ROOT/lib/libcrypto.dylib" || true

          echo "=== CMake Configure (x86_64) ==="
          # 注意：不要加 arch -x86_64！cmake 本身是 arm64 即可，
          # 通过 -DCMAKE_OSX_ARCHITECTURES=x86_64 告诉它生成 x86_64 构建文件
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DCMAKE_OSX_ARCHITECTURES=x86_64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            -DCMAKE_OSX_SYSROOT="$OSX_SYSROOT" \
            -DOPENSSL_ROOT_DIR="$OPENSSL_ROOT" \
            -DCMAKE_CXX_FLAGS="-Wno-deprecated-declarations" \
            -DCMAKE_C_FLAGS="-Wno-deprecated-declarations"

          echo "=== Diagnostic: CMake OpenSSL Detection ==="
          grep -E "OPENSSL_(SSL|CRYPTO)_LIBRARY" buildCMakeCache.txt || true

          echo "=== Build (parallel, warnings suppressed) ==="
          set +e
          # 注意：不要加 arch -x86_64！
          # cmake --build 会调用 make，make 会调用 clang -arch x86_64
          # Xcode 的 clang 是 universal binary，在 arm64 上可直接编译 x86_64
          cmake --build build --config Release \
            -- VERBOSE=1 2>&1 | tee build.log
          BUILD_EXIT_CODE=${PIPESTATUS[0]}
          set -e

          if [ "$BUILD_EXIT_CODE" -ne 0 ]; then
            echo ""
            echo "========== REAL ERRORS FOUND =========="
            grep -iE "error:|fatal error:|undefined reference|ld: |symbol not found" build.log | head -50
            echo "========================================="
            exit 1
          fi

          echo "=== Align Output ==="
          mkdir -p bin/release
          if [ ! -d "bin/release/${{ env.targetName }}.app" ]; then
            cp -R "build/${{ env.targetName }}.app" "bin/release/${{ env.targetName }}.app"
          fi

          echo "=== Verify Binary Architecture ==="
          file "bin/release/${{ env.targetName }}.app/Contents/MacOS/${{ env.targetName }}"

      - name: Package DMG
        run: |
          export PATH="$QT_ROOT_DIR/bin:/opt/homebrew/bin:$PATH"
          if [ -f "ExtBin/mac/Info.plist" ]; then
            cp -f ExtBin/mac/Info.plist "bin/release/${{ env.targetName }}.app/Contents/Info.plist"
          fi
          cp -R -p "bin/release/${{ env.targetName }}.app" "${{ env.targetName }}.app"
          QT_ACTUAL_LIB=$(qmake -query QT_INSTALL_LIBS 2>/dev/null || echo "$QT_ROOT_DIR/lib")
          # macdeployqt 不需要 arch -x86_64，它只读取二进制并拷贝文件
          macdeployqt "${{ env.targetName }}.app" \
            -verbose=1 \
            -dmg \
            -libpath="$QT_ACTUAL_LIB" \
            -libpath="./lib"
          cp "${{ env.targetName }}.dmg" "bin/release/${{ env.targetName }}.dmg"
          ls -lh "bin/release/${{ env.targetName }}.dmg"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.orgName }}-${{ env.VERSION }}
          path: bin/release/${{ env.targetName }}.dmg
          retention-days: 30

      - name: Upload to Release
        if: github.event_name == 'release'
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: bin/release/${{ env.targetName }}.dmg
          asset_name: ${{ env.orgName }}-${{ env.VERSION }}.dmg
          tag: ${{ github.ref_name }}
          overwrite: true