name: MacOS CI

on:
  push:
    branches: [main]
    paths:
      - '**'
      - '!stats.txt'
      - '!README.md'
  pull_request:
    paths:
      - '**'
  release:
    types: [published]

jobs:
  build:
    name: Build (Mac-x86_64)
    runs-on: macos-13
    permissions:
      contents: write

    env:
      targetName: Knot
      orgName: Knot
      qt_ver: "6.9.3"
      qt_arch: clang_64
      cmake_arch: x86_64
      artifact_suffix: Mac-x86_64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{ env.qt_ver }}
          host: mac
          target: desktop
          arch: ${{ env.qt_arch }}
          modules: qtcharts qtsensors qtwebview qtlocation qtwebchannel qt5compat qtpositioning qtmultimedia
          install-deps: true

      - name: Install Dependencies
        run: |
          brew update
          brew install openssl@3 cmake
          brew link openssl@3 --force

      - name: CMake Configure & Build
        run: |
          echo "=== Target Architecture: ${{ env.cmake_arch }} ==="
          echo "=== Runner Architecture: $(uname -m) ==="

          OSX_SYSROOT="$(xcrun --sdk macosx --show-sdk-path)"
          echo "=== macOS SDK: $OSX_SYSROOT ==="

          cmake -B build \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
                -DCMAKE_OSX_ARCHITECTURES=${{ env.cmake_arch }} \
                -DCMAKE_OSX_SYSROOT="$OSX_SYSROOT" \
                -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)"

          cmake --build build --config Release --parallel $(sysctl -n hw.ncpu)

      - name: Align Output
        run: |
          mkdir -p bin/release
          if [ ! -d "bin/release/${{ env.targetName }}.app" ]; then
            echo "Copying app bundle from build directory..."
            cp -R "build/${{ env.targetName }}.app" "bin/release/${{ env.targetName }}.app"
          else
            echo "App bundle already in bin/release, skipping copy."
          fi

          echo "=== Binary Verification ==="
          file "bin/release/${{ env.targetName }}.app/Contents/MacOS/${{ env.targetName }}"
          ls -la "bin/release/${{ env.targetName }}.app/Contents/MacOS/"

      - name: Package DMG
        run: |
          export PATH="$QT_ROOT_DIR/bin:$PATH"

          if [ -f "ExtBin/mac/Info.plist" ]; then
            cp -f ExtBin/mac/Info.plist "bin/release/${{ env.targetName }}.app/Contents/Info.plist"
          fi

          cp -R -p -f "bin/release/${{ env.targetName }}.app" "${{ env.targetName }}.app"

          # 自动读取 Qt 真实库路径，修复 Qt6.10 macdeployqt 检索缺陷
          QT_ACTUAL_LIB=$(qmake -query QT_INSTALL_LIBS 2>/dev/null || echo "$QT_ROOT_DIR/lib")
          macdeployqt "${{ env.targetName }}.app" -qmldir=. -verbose=1 -dmg \
            -libpath="$QT_ACTUAL_LIB" \
            -libpath="./lib"

          cp "${{ env.targetName }}.dmg" "bin/release/${{ env.targetName }}.dmg"

          echo "=== Final Artifact ==="
          ls -lh "bin/release/${{ env.targetName }}.dmg"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.orgName }}-${{ env.artifact_suffix }}
          path: bin/release/${{ env.targetName }}.dmg
          retention-days: 30

      - name: Upload to Release
        if: github.event_name == 'release'
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: bin/release/${{ env.targetName }}.dmg
          asset_name: ${{ env.orgName }}-${{ env.artifact_suffix }}.dmg
          tag: ${{ github.ref_name }}
          overwrite: true