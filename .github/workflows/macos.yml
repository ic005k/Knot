name: MacOS
on:
  push:
    branches: [main]
    paths:
      - '**'
      - '!stats.txt'
      - '!README.md'

  pull_request:
    paths:
      - '**'

  release:
    types: [published]

jobs:
  build:
    name: Build
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      matrix:
        os: [macos-14]
        qt_ver: [6.9.3]
        qt_arch: [clang_64]

    env:
      targetName: Knot
      VERSION: Mac
      orgName: Knot
      ONEDRIVE_SECRET: ${{ secrets.ONEDRIVE_SECRET }}
      QT_DIR: ${{ github.workspace }}/Qt/6.6.0/clang_64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{ matrix.qt_ver }}
          cached: 'false'
          host: mac
          target: desktop
          arch: clang_64
          modules: qtcharts qtsensors qtwebview qtlocation qtwebchannel qt5compat qtpositioning qtmultimedia
          install-deps: true
          source: false
          dir: ${{ env.QT_DIR }}

      - name: Install Homebrew (x86_64)
        run: |
          if [ -d "/opt/homebrew" ]; then
            sudo rm -rf /opt/homebrew
          fi
          arch -x86_64 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          echo 'export PATH="/usr/local/bin:$PATH"' >> ~/.bash_profile
          source ~/.bash_profile

      - name: Install OpenSSL via Homebrew (x86_64)
        run: |
          arch -x86_64 brew update
          arch -x86_64 brew install openssl
          arch -x86_64 brew link openssl --force

      # ✅ 仅替换此步骤：qmake+make → cmake（保留x86_64强制架构）
      - name: build macos
        run: |
          echo 'export PATH="/usr/local/bin:$PATH"' >> ~/.bash_profile
          source ~/.bash_profile

          export ARCHFLAGS="-arch x86_64"
          export CFLAGS="-arch x86_64"
          export CXXFLAGS="-arch x86_64"
          export LDFLAGS="-arch x86_64"

          echo "=== CMake Configure (x86_64) ==="
          arch -x86_64 cmake -B build \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
                -DCMAKE_OSX_ARCHITECTURES=x86_64

          echo "=== CMake Build (x86_64) ==="
          arch -x86_64 cmake --build build --config Release --parallel

          echo "=== 对齐产物路径（保证后续package步骤无需修改） ==="
          mkdir -p bin/release
          cp -R "build/${{ env.targetName }}.app" "bin/release/${{ env.targetName }}.app"

          echo "=== 验证产物 ==="
          ls -la "bin/release/${{ env.targetName }}.app/Contents/MacOS/"
          file "bin/release/${{ env.targetName }}.app/Contents/MacOS/${{ env.targetName }}"

      # ✅ 以下所有步骤完全保持原样，未做任何修改
      - name: package
        run: |
          cp -f ExtBin/mac/Info.plist bin/release/${targetName}.app/Contents/Info.plist
          cp -R -p -f bin/release/${targetName}.app ${targetName}.app
          macdeployqt ${targetName}.app -qmldir=. -verbose=1 -dmg
          cp ${targetName}.dmg bin/release/${targetName}.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.orgName }}-${{ env.VERSION }}
          path: bin/release/${{ env.targetName }}.dmg

      - name: uploadRelease
        if: github.event_name == 'release'
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: bin/release/${{ env.targetName }}.dmg
          asset_name: ${{ env.orgName }}-${{ env.VERSION }}.dmg
          tag: ${{ github.ref_name }}
          overwrite: true