name: MacOS-x86_64 CI

on:
  push:
    branches: [main]
    paths: ['**', '!stats.txt', '!README.md']
  pull_request:
    paths: ['**']
  release:
    types: [published]

jobs:
  build:
    name: Build-x86_64
    runs-on: macos-14
    permissions:
      contents: write

    strategy:
      matrix:
        qt_ver: ["6.9.3"]
        qt_arch: [clang_64]

    env:
      targetName: Knot
      VERSION: Mac-x86_64
      orgName: Knot
      ONEDRIVE_SECRET: ${{ secrets.ONEDRIVE_SECRET }}
      QT_ROOT_DIR: ${{ github.workspace }}/Qt/${{ matrix.qt_ver }}/macos

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{ matrix.qt_ver }}
          cached: false
          host: mac
          target: desktop
          arch: ${{ matrix.qt_arch }}
          modules: qtcharts qtsensors qtwebview qtlocation qtwebchannel qt5compat qtpositioning qtmultimedia
          install-deps: true
          source: false
          dir: ${{ github.workspace }}/Qt

      - name: Install Dependencies (arm64 Homebrew)
        run: |
          brew install openssl@3 cmake ninja

          OPENSSL_ROOT="$(brew --prefix openssl@3)"
          echo "OPENSSL_ROOT=$OPENSSL_ROOT" >> $GITHUB_ENV

          echo "=== Verify OpenSSL ==="
          file "$OPENSSL_ROOT/lib/libssl.dylib" || true

      - name: Build macOS (x86_64)
        timeout-minutes: 60
        run: |
          export PATH="/opt/homebrew/bin:$PATH"
          OSX_SYSROOT="$(xcrun --sdk macosx --show-sdk-path)"
          QT_LIB_PATH="${QT_ROOT_DIR}/lib"

          echo "=== Environment Info ==="
          echo "OpenSSL Root: $OPENSSL_ROOT"
          echo "Runner Arch:  $(uname -m)"
          echo "Qt Lib Path:  $QT_LIB_PATH"

          echo "=== CMake Configure (x86_64 Cross-Compile) ==="
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DCMAKE_OSX_ARCHITECTURES=x86_64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            -DCMAKE_OSX_SYSROOT="$OSX_SYSROOT" \
            -DOPENSSL_ROOT_DIR="$OPENSSL_ROOT" \
            -DGGML_NATIVE=OFF \
            -DLLAMA_NATIVE=OFF \
            -DCMAKE_CXX_FLAGS="-Wno-deprecated-declarations" \
            -DCMAKE_C_FLAGS="-Wno-deprecated-declarations"

          echo "=== Build ==="
          set +e
          # ✅ 【修复点】将 VERBOSE=1 替换为 Ninja 专用的 -v 参数
          cmake --build build --config Release -- -v 2>&1 | tee build.log
          BUILD_EXIT_CODE=${PIPESTATUS[0]}
          set -e

          if [ "$BUILD_EXIT_CODE" -ne 0 ]; then
            echo "========== REAL ERRORS FOUND =========="
            grep -iE "error:|fatal error:|undefined reference|ld: |symbol not found" build.log | head -50
            echo "========================================="
            exit 1
          fi

          mkdir -p bin/release
          [ ! -d "bin/release/${targetName}.app" ] && cp -R "build/${targetName}.app" "bin/release/${targetName}.app"
          file "bin/release/${targetName}.app/Contents/MacOS/${targetName}"

      - name: Package DMG
        run: |
          export PATH="$QT_ROOT_DIR/bin:/opt/homebrew/bin:$PATH"
          [ -f "ExtBin/mac/Info.plist" ] && cp -f ExtBin/mac/Info.plist "bin/release/${targetName}.app/Contents/Info.plist"
          cp -R -p "bin/release/${targetName}.app" "${targetName}.app"

          QT_ACTUAL_LIB=$(qmake -query QT_INSTALL_LIBS 2>/dev/null || echo "$QT_ROOT_DIR/lib")
          macdeployqt "${targetName}.app" -verbose=1 -dmg \
            -libpath="$QT_ACTUAL_LIB" -libpath="./lib"

          cp "${targetName}.dmg" "bin/release/${targetName}.dmg"
          ls -lh "bin/release/${targetName}.dmg"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.orgName }}-${{ env.VERSION }}
          path: bin/release/${{ env.targetName }}.dmg
          retention-days: 30

      - name: Upload to Release
        if: github.event_name == 'release'
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: bin/release/${{ env.targetName }}.dmg
          asset_name: ${{ env.orgName }}-${{ env.VERSION }}.dmg
          tag: ${{ github.ref_name }}
          overwrite: true