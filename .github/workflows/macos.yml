name: MacOS CI

on:
  push:
    branches: [main]
    paths:
      - '**'
      - '!stats.txt'
      - '!README.md'
  pull_request:
    paths:
      - '**'
  release:
    types: [published]

jobs:
  build:
    name: Build-x86_64
    runs-on: macos-13
    permissions:
      contents: write

    env:
      targetName: Knot
      orgName: Knot
      VERSION: Mac-x86_64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: "6.9.3"
          cached: false
          host: mac
          target: desktop
          arch: clang_64
          modules: qtcharts qtsensors qtwebview qtlocation qtwebchannel qt5compat qtpositioning qtmultimedia
          install-deps: true
          source: false
          dir: ${{ github.workspace }}/Qt

      - name: Install Homebrew & OpenSSL (x86_64)
        run: |
          # ✅ 对齐 arm64：显式确保 brew 在 PATH 中
          echo "/usr/local/bin" >> $GITHUB_PATH
          brew update
          brew install openssl@3 cmake
          brew link openssl@3 --force

      - name: Build macOS (x86_64)
        timeout-minutes: 30  # ✅ 对齐 arm64：防止卡死
        run: |
          export PATH="/usr/local/bin:$PATH"

          OPENSSL_ROOT="$(brew --prefix openssl@3)"
          OSX_SYSROOT="$(xcrun --sdk macosx --show-sdk-path)"

          echo "=== Environment Info ==="
          echo "OpenSSL Root: $OPENSSL_ROOT"
          echo "macOS SDK:    $OSX_SYSROOT"
          echo "Runner Arch:  $(uname -m)"

          echo "=== CMake Configure (x86_64) ==="
          cmake -B build \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
                -DCMAKE_OSX_ARCHITECTURES=x86_64 \
                -DCMAKE_OSX_SYSROOT="$OSX_SYSROOT" \
                -DOPENSSL_ROOT_DIR="$OPENSSL_ROOT"

          echo "=== CMake Build (x86_64) ==="
          cmake --build build --config Release --parallel $(sysctl -n hw.ncpu)

          echo "=== Align Output ==="
          mkdir -p bin/release
          if [ ! -d "bin/release/${{ env.targetName }}.app" ]; then
            echo "App bundle not in bin/release, copying from build..."
            cp -R "build/${{ env.targetName }}.app" "bin/release/${{ env.targetName }}.app"
          else
            echo "App bundle already in bin/release."
          fi

          echo "=== Verify Binary Architecture ==="
          file "bin/release/${{ env.targetName }}.app/Contents/MacOS/${{ env.targetName }}"

      - name: Package DMG
        run: |
          export PATH="$QT_ROOT_DIR/bin:/usr/local/bin:$PATH"

          if [ -f "ExtBin/mac/Info.plist" ]; then
            cp -f ExtBin/mac/Info.plist "bin/release/${{ env.targetName }}.app/Contents/Info.plist"
          fi

          cp -R -p "bin/release/${{ env.targetName }}.app" "${{ env.targetName }}.app"

          QT_ACTUAL_LIB=$(qmake -query QT_INSTALL_LIBS 2>/dev/null || echo "$QT_ROOT_DIR/lib")
          macdeployqt "${{ env.targetName }}.app" \
            -qmldir=. \
            -verbose=1 \
            -dmg \
            -libpath="$QT_ACTUAL_LIB" \
            -libpath="./lib"

          cp "${{ env.targetName }}.dmg" "bin/release/${{ env.targetName }}.dmg"

          echo "=== Final Artifact ==="
          ls -lh "bin/release/${{ env.targetName }}.dmg"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.orgName }}-${{ env.VERSION }}
          path: bin/release/${{ env.targetName }}.dmg
          retention-days: 30

      - name: Upload to Release
        if: github.event_name == 'release'
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: bin/release/${{ env.targetName }}.dmg
          asset_name: ${{ env.orgName }}-${{ env.VERSION }}.dmg
          tag: ${{ github.ref_name }}
          overwrite: true