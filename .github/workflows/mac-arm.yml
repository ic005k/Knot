name: MacOS-ARM
on:
  push:
    paths:
      - '**.pro'
      - '.github/workflows/mac-arm.yml'
  pull_request:
    paths:
      - '**.pro'

jobs:
  build:
    name: Build-ARM
    runs-on: macos-latest
    env:
      targetName: Knot
      VERSION: Mac-ARM
      orgName: Knot
      QT_VERSION: 6.9.3
      QT_PREFIX: $HOME/Qt/${QT_VERSION}/macos

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Install Qt Official Installer
        run: |
          wget -q https://download.qt.io/official_releases/online_installers/qt-unified-mac-x64-arm64-online.dmg
          hdiutil attach -quiet qt-unified-mac-x64-arm64-online.dmg
          cp -r "/Volumes/Qt Unified Installer/qt-unified-mac-x64-arm64-online.app" ./qt-install.app

          QT_NUM="${QT_VERSION//./}"
          # 全部$转义为$$，避免YAML解析报错
          cat > install.qs <<'EOF'
          function Controller() {
          this.autoAcceptSelections = true;
          this.setRepository("https://download.qt.io/online/qtsdkrepository/mac/desktop/qt6_$QT_NUM/");
          var target = "$QT_PREFIX";
          var ver = "${QT_VERSION}";
          this.addQt(target, ver, "universal", ["qtcharts","qtsensors","qtwebview","qtlocation","qtwebchannel","qt5compat","qtpositioning","qtmultimedia"]);
          this.runInstaller();
          }
          EOF

          ./qt-install.app/Contents/MacOS/qt-unified-mac-x64-arm64-online --script install.qs
          hdiutil detach -quiet "/Volumes/Qt Unified Installer"
        env:
          QT_VERSION: ${{ env.QT_VERSION }}

      - name: Add Qt to PATH
        run: echo "${{ env.QT_PREFIX }}/bin" >> $GITHUB_PATH

      - name: Setup ARM Homebrew PATH
        run: |
          echo '/opt/homebrew/bin' >> $GITHUB_PATH
          source ~/.zshrc

      - name: Install OpenSSL3 arm64
        run: |
          brew update
          brew install openssl@3
          brew link --force openssl@3
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> $GITHUB_ENV

      - name: Build Project Only arm64
        run: |
          export PKG_CONFIG_PATH="$OPENSSL_ROOT_DIR/lib/pkgconfig:$PKG_CONFIG_PATH"
          qmake "CONFIG += release" "QMAKE_APPLE_DEVICE_ARCHS=arm64" "LIBS += -L$OPENSSL_ROOT_DIR/lib"
          make -j$(sysctl -n hw.ncpu)

      - name: Package ARM App
        run: |
          cp -f Info.plist bin/release/${targetName}.app/Contents/Info.plist
          cp -R -p -f bin/release/${targetName}.app ${targetName}.app
          macdeployqt ${targetName}.app -qmldir=. -verbose=1 -dmg -always-overwrite
          cp ${targetName}.dmg bin/release/${targetName}-arm64.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.orgName }}-${{ env.VERSION }}-arm64
          path: bin/release/${{ env.targetName }}-arm64.dmg

      - name: Upload Release Asset
        if: startsWith(github.event.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: bin/release/${{ env.targetName }}-arm64.dmg
          tag_name: ${{ github.ref_name }}
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}