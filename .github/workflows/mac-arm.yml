name: MacOS-ARM
on:
  push:
    paths:
      - '**.pro'
      - '.github/workflows/mac-arm.yml'
  pull_request:
    paths:
      - '**.pro'

jobs:
  build:
    name: Build-ARM
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      targetName: Knot
      VERSION: Mac-ARM
      orgName: Knot
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 原生arm64 Homebrew，不删除任何架构
      - name: Setup ARM Homebrew
        run: |
          echo '/opt/homebrew/bin' >> $GITHUB_PATH
          source ~/.zshrc

      # Brew 直接安装Qt6.10.3 arm64（彻底抛弃aqt/install-qt-action，不会报qt_base）
      - name: Install Qt 6.10.3 via Brew
        run: |
          brew update
          brew install qt@6.10
          brew link --force qt@6.10
          echo "QT_BIN=/opt/homebrew/opt/qt@6.10/bin" >> $GITHUB_ENV

      # 安装OpenSSL arm64
      - name: Install OpenSSL
        run: |
          brew install openssl@3
          brew link --force openssl@3
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> $GITHUB_ENV

      # 纯arm64编译，不套arch -x86_64，锁定arm64
      - name: Build Project ARM64 Only
        run: |
          export PATH=${{ env.QT_BIN }}:$PATH
          export PKG_CONFIG_PATH="$OPENSSL_ROOT_DIR/lib/pkgconfig:$PKG_CONFIG_PATH"
          # 强制仅编译arm64
          qmake "CONFIG += release" "QMAKE_APPLE_DEVICE_ARCHS=arm64" "LIBS += -L$OPENSSL_ROOT_DIR/lib"
          make -j$(sysctl -n hw.ncpu)

      # 打包流程完全复用你原有逻辑
      - name: Package ARM App & DMG
        run: |
          cp -f ExtBin/mac/Info.plist bin/release/${targetName}.app/Contents/Info.plist
          cp -R -p -f bin/release/${targetName}.app ${targetName}.app

          macdeployqt ${targetName}.app \
            -qmldir=. \
            -verbose=1 \
            -dmg \
            -always-overwrite
          cp ${targetName}.dmg bin/release/${targetName}-arm64.dmg

      # 上传制品
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.orgName }}-${{ env.VERSION }}-arm64
          path: bin/release/${{ env.targetName }}-arm64.dmg

      # tag发布自动上传资产
      - name: uploadRelease
        if: github.event_name == 'release'
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: bin/release/${{ env.targetName }}-arm64.dmg
          asset_name: ${{ env.orgName }}-${{ env.VERSION }}-arm64.dmg
          tag: ${{ github.ref_name }}
          overwrite: true