name: MacOS-arm64

on:
  push:
    branches: [main]
    paths:
      - '**'
      - '!stats.txt'
      - '!README.md'
  pull_request:
    paths:
      - '**'
  release:
    types: [published]

jobs:
  build:
    name: Build-arm64
    runs-on: macos-14   # Apple Silicon
    permissions:
      contents: write

    strategy:
      matrix:
        qt_ver: [6.9.3]
        qt_arch: [clang_64]

    env:
      targetName: Knot
      VERSION: Mac-arm64
      orgName: Knot
      ONEDRIVE_SECRET: ${{ secrets.ONEDRIVE_SECRET }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{ matrix.qt_ver }}
          cached: false
          host: mac
          target: desktop
          arch: clang_64
          modules: >
            qtcharts
            qtsensors
            qtwebview
            qtlocation
            qtwebchannel
            qt5compat
            qtpositioning
            qtmultimedia
          install-deps: true
          source: false
          dir: ${{ github.workspace }}/Qt

      # ✅ 修复：用 GITHUB_ENV 持久化 PATH，source bash_profile 不会传递到后续步骤
      - name: Install Homebrew & OpenSSL (arm64)
        run: |
          echo "/opt/homebrew/bin" >> $GITHUB_PATH
          brew update
          brew install openssl
          brew link openssl --force

      - name: Build macOS (arm64)
        timeout-minutes: 30
        run: |
          export PATH="/opt/homebrew/bin:$PATH"

          echo "=== CMake Configure (arm64) ==="
          cmake -B build \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
                -DCMAKE_OSX_ARCHITECTURES=arm64

          echo "=== CMake Build (arm64) ==="
          # ✅ 限制并行数防止 OOM / 超时
          cmake --build build --config Release --parallel 4

          echo "=== 对齐产物路径 ==="
          mkdir -p bin/release

          if [ ! -d "bin/release/${{ env.targetName }}.app" ]; then
            echo "未在 bin/release 找到产物，尝试从 build 目录复制..."
            cp -R "build/${{ env.targetName }}.app" "bin/release/${{ env.targetName }}.app"
          else
            echo "产物已在 bin/release 目录中，跳过复制"
          fi

          echo "=== 验证产物架构 ==="
          file "bin/release/${{ env.targetName }}.app/Contents/MacOS/${{ env.targetName }}"

      - name: Package
        run: |
          cp -f ExtBin/mac/Info.plist bin/release/${targetName}.app/Contents/Info.plist
          cp -R -p bin/release/${targetName}.app ${targetName}.app

          QT_ACTUAL_LIB="$QT_ROOT_DIR/lib"
          macdeployqt ${targetName}.app -qmldir=. -verbose=1 -dmg \
            -libpath="$QT_ACTUAL_LIB" \
            -libpath="./lib"

          cp ${targetName}.dmg bin/release/${targetName}.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.orgName }}-${{ env.VERSION }}
          path: bin/release/${{ env.targetName }}.dmg

      - name: Upload Release
        if: github.event_name == 'release'
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: bin/release/${{ env.targetName }}.dmg
          asset_name: ${{ env.orgName }}-${{ env.VERSION }}.dmg
          tag: ${{ github.ref_name }}
          overwrite: true