name: MacOS-arm64

on:
  push:
    branches: [main]
    paths:
      - '**'
      - '!stats.txt'
      - '!README.md'

  pull_request:
    paths:
      - '**'

  release:
    types: [published]

jobs:
  build:
    name: Build-arm64
    runs-on: macos-14   # Apple Silicon

    permissions:
      contents: write

    strategy:
      matrix:
        os: [macos-14]
        qt_ver: [6.10.3]
        qt_arch: [clang_64]

    env:
      targetName: Knot
      VERSION: Mac-arm64
      orgName: Knot
      ONEDRIVE_SECRET: ${{ secrets.ONEDRIVE_SECRET }}
      QT_DIR: ${{ github.workspace }}/Qt/${{ matrix.qt_ver }}/clang_64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ✅ 安装 Qt（universal，含 arm64）
      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{ matrix.qt_ver }}
          cached: false
          host: mac
          target: desktop
          arch: clang_64
          modules: >
            qtcharts
            qtsensors
            qtwebview
            qtlocation
            qtwebchannel
            qt5compat
            qtpositioning
            qtmultimedia
          install-deps: true
          source: false
          dir: ${{ github.workspace }}/Qt

      # ✅ 安装 arm64 Homebrew
      - name: Install Homebrew (arm64)
        run: |
          echo 'export PATH="/opt/homebrew/bin:$PATH"' >> ~/.bash_profile
          source ~/.bash_profile

      # ✅ 安装 OpenSSL
      - name: Install OpenSSL
        run: |
          brew update
          brew install openssl
          brew link openssl --force

      # ✅ 编译（原生 arm64）
      - name: Build macOS (arm64)
        run: |
          export PATH="/opt/homebrew/bin:$PATH"

          qmake "CONFIG += release" "QMAKE_APPLE_DEVICE_ARCHS=arm64"
          make -j$(sysctl -n hw.ncpu)

      # ✅ 打包
      - name: Package
        run: |
          cp -f ExtBin/mac/Info.plist bin/release/${targetName}.app/Contents/Info.plist
          cp -R -p bin/release/${targetName}.app ${targetName}.app

          #######################################################################
          # 自动读取当前Qt真实库路径，修复Qt6.10 macdeployqt检索缺陷
          QT_ACTUAL_LIB=$(qmake -query QT_INSTALL_LIBS)
          macdeployqt ${targetName}.app -qmldir=. -verbose=1 -dmg \
            -libpath="$QT_ACTUAL_LIB" \
            -libpath="./lib"

          ########################################################################
          #macdeployqt ${targetName}.app -qmldir=. -verbose=1 -dmg

          cp ${targetName}.dmg bin/release/${targetName}.dmg

      # ✅ 上传 Artifact
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.orgName }}-${{ env.VERSION }}
          path: bin/release/${{ env.targetName }}.dmg

      # ✅ 上传 Release
      - name: Upload Release
        if: github.event_name == 'release'
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: bin/release/${{ env.targetName }}.dmg
          asset_name: ${{ env.orgName }}-${{ env.VERSION }}.dmg
          tag: ${{ github.ref_name }}
          overwrite: true