name: MacOS-ARM
on:
  push:
    paths:
      - '**.pro'
      - '.github/workflows/mac-arm.yml'
  pull_request:
    paths:
      - '**.pro'

jobs:
  build:
    name: Build-ARM
    runs-on: macos-latest
    env:
      targetName: Knot
      VERSION: Mac-ARM
      orgName: Knot
      QT_VERSION: 6.10.3
      QT_ARCH: mac_arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Qt (ARM64 专用Qt)
        id: install_qt
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          target: desktop
          arch: ${{ env.QT_ARCH }}
          modules: qtcharts qt5compat qtsensors
          install-deps: true
          cached: true

      - name: Setup Qt Environment
        run: |
          echo "QT_ROOT=$HOME/Qt" >> $GITHUB_ENV
          echo "$HOME/Qt/${{ env.QT_VERSION }}/macos/bin" >> $GITHUB_PATH

      - name: Setup Homebrew ARM 原生环境
        run: |
          echo '/opt/homebrew/bin' >> $GITHUB_PATH
          # 刷新PATH，确保后续brew走arm64原生
          source ~/.zshrc

      - name: Install OpenSSL3 arm64
        run: |
          brew update
          brew install openssl@3
          brew link --force openssl@3
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> $GITHUB_ENV

      - name: Build Project 纯arm64
        run: |
          export PKG_CONFIG_PATH="$OPENSSL_ROOT_DIR/lib/pkgconfig:$PKG_CONFIG_PATH"
          # 强制仅编译arm64架构，不兼容x86
          qmake "CONFIG += release" \
                "QMAKE_APPLE_DEVICE_ARCHS=arm64" \
                "LIBS += -L$OPENSSL_ROOT_DIR/lib"
          make -j$(sysctl -n hw.ncpu)

      - name: Package ARM App & DMG
        run: |
          cp -f Info.plist bin/release/${targetName}.app/Contents/Info.plist
          cp -R -p -f bin/release/${targetName}.app ${targetName}.app

          # macdeployqt 打包arm64专属Qt依赖
          macdeployqt ${targetName}.app \
            -qmldir=. \
            -verbose=1 \
            -dmg \
            -always-overwrite
          cp ${targetName}.dmg bin/release/${targetName}-arm64.dmg

      - name: Upload ARM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.orgName }}-${{ env.VERSION }}-arm64
          path: bin/release/${{ env.targetName }}-arm64.dmg

      - name: Upload ARM Asset to Tag Release
        if: startsWith(github.event.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: bin/release/${{ env.targetName }}-arm64.dmg
          tag_name: ${{ github.ref_name }}
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}