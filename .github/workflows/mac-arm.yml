name: MacOS-ARM
on:
  push:
    paths:
      - '**.pro'
      - '.github/workflows/mac-arm.yml'
  pull_request:
    paths:
      - '**.pro'

jobs:
  build:
    name: Build-ARM
    runs-on: macos-latest
    env:
      targetName: Knot
      VERSION: Mac-ARM
      orgName: Knot
      QT_VERSION: 6.10.3
      # 关键：安装架构改为 universal，6.10.3 mac 仅提供universal Qt安装包
      QT_INSTALL_ARCH: universal
      # 编译架构仍锁定arm64，只输出arm单架构程序
      QT_BUILD_ARCH: arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 和你x86可用CI保持一致安装逻辑，arch改为universal解决包不存在报错
      - name: Install Qt
        id: install_qt
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          target: desktop
          arch: ${{ env.QT_INSTALL_ARCH }}
          modules: qtcharts qtsensors qtwebview qtlocation qtwebchannel qt5compat qtpositioning qtmultimedia
          install-deps: true
          cached: false

      - name: Setup Qt Environment
        run: |
          echo "$HOME/Qt/${{ env.QT_VERSION }}/macos/bin" >> $GITHUB_PATH

      - name: Setup Homebrew (ARM原生)
        run: |
          echo '/opt/homebrew/bin' >> $GITHUB_PATH
          source ~/.zshrc

      - name: Install OpenSSL via Homebrew (ARM)
        run: |
          brew update
          brew install openssl@3
          brew link --force openssl@3
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> $GITHUB_ENV

      - name: Build Project (仅输出arm64单架构)
        run: |
          export PKG_CONFIG_PATH="$OPENSSL_ROOT_DIR/lib/pkgconfig:$PKG_CONFIG_PATH"
          # qmake强制仅编译arm64，虽然Qt是universal，但产物只有arm架构
          qmake "CONFIG += release" \
                "QMAKE_APPLE_DEVICE_ARCHS=${{ env.QT_BUILD_ARCH }}" \
                "LIBS += -L$OPENSSL_ROOT_DIR/lib"
          make -j$(sysctl -n hw.ncpu)

      - name: Package Application
        run: |
          cp -f Info.plist bin/release/${targetName}.app/Contents/Info.plist
          cp -R -p -f bin/release/${targetName}.app ${targetName}.app

          macdeployqt ${targetName}.app \
            -qmldir=. \
            -verbose=1 \
            -dmg \
            -always-overwrite
          cp ${targetName}.dmg bin/release/${targetName}-arm64.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.orgName }}-${{ env.VERSION }}-arm64
          path: bin/release/${{ env.targetName }}-arm64.dmg

      - name: Upload Release (ARM)
        if: startsWith(github.event.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: bin/release/${{ env.targetName }}-arm64.dmg
          tag_name: ${{ github.ref_name }}
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}