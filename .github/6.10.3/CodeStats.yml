name: Code Stats
on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'

jobs:
  stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install cloc
        run: sudo apt-get install cloc
      - name: Count lines
        run: |
          cloc . --out=stats.txt
          cat stats.txt

      - name: Push stats to stats branch
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          # 1. 先将 stats.txt 移到临时目录保护起来
          cp stats.txt /tmp/stats.txt

          # 2. 创建单独分支并清空工作区（这里的 rm 是安全的）
          git checkout --orphan stats
          git rm -rf .

          # 3. 把 stats.txt 移回来并提交
          cp /tmp/stats.txt stats.txt
          git add stats.txt
          git commit -m "Update code stats $(date +'%Y-%m-%d %H:%M')" || echo "No changes"

          # 4. 强制推送到远程 stats 分支
          git push origin stats --force